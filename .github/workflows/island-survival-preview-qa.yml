name: Island Survival 3D Preview QA
on:
  push:
    branches:
      - feature/island-survival-3d
    paths:
      - 'island-survival/**'
      - 'server.py'
      - 'qa/island-survival.mjs'
      - '.github/workflows/island-survival-preview-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  island:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate JS syntax, game rules and routes
        run: |
          for file in island-survival/*.js; do node --check "$file"; done
          node qa/island-survival.mjs
          python3 -m py_compile server.py
      - name: Chromium real UI smoke
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          python3 -m http.server 4181 --bind 127.0.0.1 >/tmp/island-http.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:4181/island-survival/ >/dev/null && break; sleep 1; done
          node - <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--use-gl=angle','--use-angle=swiftshader']});
            const page=await browser.newPage({viewport:{width:1440,height:900}});
            const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            await page.goto('http://127.0.0.1:4181/island-survival/',{waitUntil:'domcontentloaded',timeout:60000});
            await page.getByRole('button',{name:/Bắt đầu khám phá/}).waitFor({timeout:35000});
            await page.waitForFunction(()=>window.__ISLAND_3D_MODE,{timeout:40000});
            const mode=await page.evaluate(()=>window.__ISLAND_3D_MODE);
            if(mode!=='webgl-three')throw new Error('3D WebGL not active: '+mode);
            console.log('ISLAND_WEBGL_3D_OK');
            await page.waitForFunction(()=>document.getElementById('camera-status')?.textContent?.includes('Toàn cảnh'),{timeout:40000});
            const readView=()=>page.evaluate(()=>window.__ISLAND_VIEW);
            const initial=await readView();
            if(!initial||!Number.isFinite(initial.yaw))throw Error('Camera state missing.');
            await page.getByRole('button',{name:'Xoay phải'}).click();
            const rotated=await readView();
            if(Math.abs(rotated.yaw-initial.yaw)<.15)throw Error('3D orbit button does not rotate camera.');
            await page.getByRole('button',{name:'Phóng to'}).click();
            const zoomed=await readView();
            if(zoomed.distance>=rotated.distance)throw Error('3D zoom button does not zoom.');
            await page.getByRole('button',{name:'Về toàn cảnh'}).click();
            const reset=await readView();
            if(Math.abs(reset.yaw-initial.yaw)>.001||Math.abs(reset.distance-initial.distance)>.001)throw Error('Reset camera failed.');
            const canvas=page.locator('#world'),rect=await canvas.boundingBox();
            if(!rect)throw Error('3D canvas has no bounds');
            const sx=rect.x+rect.width*.52,sy=rect.y+rect.height*.53;
            await page.mouse.move(sx,sy);await page.mouse.down();
            await page.mouse.move(sx+160,sy+46,{steps:12});await page.mouse.up();
            const dragged=await readView();
            if(Math.abs(dragged.yaw-reset.yaw)<.3)throw Error('Mouse drag fails to rotate islands.');
            await page.mouse.move(sx,sy);await page.mouse.wheel(0,-450);
            const wheeled=await readView();
            if(wheeled.distance>=dragged.distance)throw Error('Mouse wheel zoom fails.');
            await page.getByRole('button',{name:'Xem đảo đội tiếp theo'}).click();
            const focused=await readView();
            if(focused.focusIndex!==0||focused.distance>=wheeled.distance)throw Error('Island navigation fails to focus.');
            await page.getByRole('button',{name:'Về toàn cảnh'}).click();
            const overview=await readView();
            if(overview.focusIndex!==-1)throw Error('Overview reset does not restore all islands.');
            console.log('ISLAND_3D_CAMERA_CONTROLS_PASS');
            await page.getByRole('button',{name:/Bắt đầu khám phá/}).click();
            await page.getByText('ĐỌC CÂU HỎI').first().waitFor({timeout:20000});
            const cockpit=await page.evaluate(()=>{
              const stage=document.querySelector('section.stage'),world=document.querySelector('#world-wrap'),popup=document.querySelector('#question-panel');
              const toolbar=document.querySelector('.stage .toolbar'),scores=document.querySelector('#team-board');
              const screen={width:innerWidth,height:innerHeight,scrollY:scrollY};
              const rect=el=>{const r=el.getBoundingClientRect();return{x:r.x,y:r.y,width:r.width,height:r.height,bottom:r.bottom,right:r.right}};
              return{isFull:document.body.classList.contains('island-gameplay'),screen,stage:rect(stage),
                world:rect(world),popup:rect(popup),toolbar:rect(toolbar),scores:rect(scores),
                popupInsideWorld:world.contains(popup),toolbarInsideWorld:world.contains(toolbar),scoresInsideWorld:world.contains(scores)};
            });
            if(!cockpit.isFull||!cockpit.popupInsideWorld||!cockpit.toolbarInsideWorld||!cockpit.scoresInsideWorld)
              throw Error('Quiz, construction and controls must live within one island stage '+JSON.stringify(cockpit));
            if(Math.abs(cockpit.stage.height-cockpit.screen.height)>3||cockpit.popup.bottom>cockpit.screen.height||cockpit.popup.y<0||cockpit.toolbar.bottom>cockpit.screen.height)
              throw Error('Game cockpit extends beyond viewport '+JSON.stringify(cockpit));
            console.log('ISLAND_SINGLE_SCREEN_COCKPIT_PASS');
            await page.getByRole('button',{name:/Đã đọc xong/}).click();
            await page.getByRole('button',{name:/Bắt đầu trả lời/}).click();
            await page.locator('[data-answer="A"]').click();
            await page.getByRole('button',{name:/Chọn công trình/}).click();
            if(!(await page.evaluate(()=>document.querySelector('#world-wrap').contains(document.querySelector('[data-build="shield"]')))))
              throw Error('Construction actions are outside 3D island cockpit.');
            await page.locator('[data-build="save"]').click();
            await page.getByRole('button',{name:/Tiếp lượt/}).click();
            await page.getByRole('button',{name:/Tạm dừng/}).click();
            await page.getByRole('button',{name:/Tiếp tục/}).click();
            if(errors.length)throw Error('Browser JS errors: '+errors.join(' / '));
            console.log('ISLAND_CHROMIUM_QA_PASS');
            const touchContext=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
            const mobile=await touchContext.newPage();
            const mobileErrors=[];
            mobile.on('pageerror',e=>mobileErrors.push(e.message));
            await mobile.goto('http://127.0.0.1:4181/island-survival/',{waitUntil:'domcontentloaded',timeout:60000});
            await mobile.waitForFunction(()=>document.getElementById('camera-status')?.textContent?.includes('Toàn cảnh'),null,{timeout:40000});
            const mobileView=()=>mobile.evaluate(()=>window.__ISLAND_VIEW);
            const tv=await mobileView();
            const area=await mobile.locator('#world').boundingBox();
            const cdp=await touchContext.newCDPSession(mobile);
            const mobileX=area.x+area.width*.43,mobileY=area.y+area.height*.62;
            await cdp.send('Input.dispatchTouchEvent',{type:'touchStart',touchPoints:[{x:mobileX,y:mobileY}]});
            for(let step=1;step<=6;step++){
              await cdp.send('Input.dispatchTouchEvent',{type:'touchMove',touchPoints:[{x:mobileX+step*14,y:mobileY+step*2}]});
            }
            await cdp.send('Input.dispatchTouchEvent',{type:'touchEnd',touchPoints:[]});
            const draggedTouch=await mobileView();
            if(Math.abs(draggedTouch.yaw-tv.yaw)<.15)throw Error('Real touch drag does not rotate islands.');
            const pinX=area.x+area.width*.48,pinY=area.y+area.height*.60;
            const dist0=draggedTouch.distance;
            await cdp.send('Input.dispatchTouchEvent',{type:'touchStart',touchPoints:[{x:pinX-23,y:pinY},{x:pinX+23,y:pinY}]});
            for(let step=1;step<=4;step++){
              await cdp.send('Input.dispatchTouchEvent',{type:'touchMove',touchPoints:[{x:pinX-23-step*8,y:pinY},{x:pinX+23+step*8,y:pinY}]});
            }
            await cdp.send('Input.dispatchTouchEvent',{type:'touchEnd',touchPoints:[]});
            const pinched=await mobileView();
            if(pinched.distance>=dist0)throw Error('Pinch zoom does not enlarge islands.');
            await mobile.getByRole('button',{name:'Về toàn cảnh'}).tap();
            if((await mobileView()).focusIndex!==-1)throw Error('Mobile camera reset failed.');
            await mobile.getByRole('button',{name:/Bắt đầu khám phá/}).tap();
            await mobile.getByRole('button',{name:/Đã đọc xong/}).waitFor({timeout:30000});
            const mobileCockpit=await mobile.evaluate(()=>{
              const popup=document.getElementById('question-panel').getBoundingClientRect(),
               stage=document.querySelector('.stage').getBoundingClientRect(),
               toolbar=document.querySelector('.stage .toolbar').getBoundingClientRect();
              return{vh:innerHeight,vw:innerWidth,stageHeight:stage.height,popupTop:popup.top,popupBottom:popup.bottom,
                toolbarBottom:toolbar.bottom,windowScroll:scrollY,htmlOverflow:getComputedStyle(document.body).overflow};
            });
            if(mobileCockpit.htmlOverflow!=='hidden'||mobileCockpit.popupTop<0||
               mobileCockpit.popupBottom>mobileCockpit.vh+1||mobileCockpit.toolbarBottom>mobileCockpit.vh+1||
               Math.abs(mobileCockpit.stageHeight-mobileCockpit.vh)>3)
              throw Error('Mobile question popup is not visible on the island '+JSON.stringify(mobileCockpit));
            await mobile.getByRole('button',{name:/Đã đọc xong/}).tap();
            await mobile.getByRole('button',{name:/Bắt đầu trả lời/}).tap();
            await mobile.locator('[data-answer="A"]').tap({timeout:10000});
            await mobile.getByRole('button',{name:/Chọn công trình/}).tap();
            if(!(await mobile.evaluate(()=>document.querySelector('#world-wrap').contains(document.querySelector('[data-build="save"]')))))
              throw Error('Mobile construction choices are not inside the island cockpit.');
            console.log('ISLAND_MOBILE_QUIZ_POPUP_PASS');
            if(mobileErrors.length)throw Error('Mobile JS errors: '+mobileErrors.join(' / '));
            console.log('ISLAND_MOBILE_TOUCH_PINCH_PASS');
            await touchContext.close();
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
