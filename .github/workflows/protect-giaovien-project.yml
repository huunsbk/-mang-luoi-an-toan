name: Protect giaovien from main auto deploy

on:
  push:
    branches:
      - giaovien-portal
    paths:
      - '.github/workflows/protect-giaovien-project.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: huunsbks-projects
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Link giaovien
        run: npx --yes vercel@59.19.1 link --yes --project giaovien --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
      - name: Disconnect automatic Git provider
        run: npx --yes vercel@59.19.1 git disconnect --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
