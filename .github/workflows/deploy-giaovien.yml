name: Deploy giaovien portal

on:
  push:
    branches:
      - giaovien-portal
    paths:
      - '.github/workflows/deploy-giaovien.yml'
      - 'server.py'
      - 'index.html'
      - 'pose-quiz/**'
      - 'boc-tham/**'
      - 'mang-luoi-an-toan/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: huunsbks-projects
    steps:
      - uses: actions/checkout@v4

      - name: Check Vercel credential
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN is not configured in this GitHub repository."
            exit 2
          fi
          echo "Vercel credential is configured."

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Link or create Vercel project giaovien
        run: |
          npx --yes vercel@59.19.1 link --yes --project giaovien --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"

      - name: Deploy production
        id: deploy
        run: |
          URL=$(npx --yes vercel@59.19.1 deploy --prod --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Production URL: $URL"

      - name: Verify production routes
        run: |
          BASE="https://giaovien-psi.vercel.app"

          curl --fail-with-body --location --retry 5 --retry-delay 3 -sS "$BASE/" -o /tmp/home.html
          grep -q "CỔNG CÔNG CỤ GIÁO VIÊN SỐ" /tmp/home.html

          curl --fail-with-body --location --retry 5 --retry-delay 3 -sS "$BASE/pose-quiz/" -o /tmp/pose.html
          grep -q "AI POSE QUIZ" /tmp/pose.html
          grep -q '/pose-quiz/supabase-config.js' /tmp/pose.html
          grep -q 'href="/"' /tmp/pose.html
          grep -q "questions.import.preview" /tmp/pose.html
          grep -q "Nhập nhanh" /tmp/pose.html
          grep -q "Nền bài dạy" /tmp/pose.html
          grep -q "defaultFeedback" /tmp/pose.html
          grep -q "bgmVolume" /tmp/pose.html
          if grep -Fq "options.headers['x-pose-action']" /tmp/pose.html; then
            echo "Redundant x-pose-action header is still present in production frontend"
            exit 1
          fi

          # Verify the exact browser preflight that previously blocked media/audio uploads.
          curl -sS -D /tmp/pose-cors.headers -o /tmp/pose-cors.body -X OPTIONS \
            "https://exfnarddchxzfewlztwb.supabase.co/functions/v1/pose-quiz-api?action=media.upload" \
            -H "Origin: $BASE" \
            -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: authorization,apikey,x-pose-action"
          grep -Eqi '^access-control-allow-origin: *\*' /tmp/pose-cors.headers
          grep -Eqi '^access-control-allow-methods:.*POST' /tmp/pose-cors.headers
          grep -Eqi '^access-control-allow-headers:.*authorization' /tmp/pose-cors.headers
          grep -Eqi '^access-control-allow-headers:.*apikey' /tmp/pose-cors.headers
          grep -Eqi '^access-control-allow-headers:.*x-pose-action' /tmp/pose-cors.headers
          echo "POSE_MEDIA_CORS_PREFLIGHT_OK"

          curl --fail-with-body --location --retry 5 --retry-delay 3 -sS "$BASE/pose-quiz/supabase-config.js" -o /tmp/config.js
          grep -q "POSE_QUIZ_SUPABASE" /tmp/config.js
          curl --fail-with-body --location --retry 5 --retry-delay 3 -sS "$BASE/supabase-config.js" -o /tmp/config-root.js
          grep -q "POSE_QUIZ_SUPABASE" /tmp/config-root.js

          curl --fail-with-body --location --retry 5 --retry-delay 3 -sS "$BASE/boc-tham/" -o /tmp/boc.html
          grep -qi "bốc thăm" /tmp/boc.html
          grep -q 'href="/"' /tmp/boc.html

          curl --fail-with-body --location --retry 5 --retry-delay 3 -sS "$BASE/mang-luoi-an-toan/" -o /tmp/safety.html
          grep -qi "bản đồ phản hồi" /tmp/safety.html
          grep -q 'href="/"' /tmp/safety.html

          curl --fail-with-body --location --retry 5 --retry-delay 3 -sS "$BASE/api/health" -o /tmp/health.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/health.json'))
          assert d.get('ok') is True, d
          assert d.get('room_question') == 'ok', d
          assert d.get('submit') == 'ok', d
          assert d.get('read') == 'ok', d
          assert d.get('qr') == 'ok', d
          print('PRODUCTION_ALIAS_OK')
          PY

          grep -q "Lưu kết quả" /tmp/safety.html
          grep -q "Kết quả đã lưu" /tmp/safety.html

          # Real production lifecycle for persisted feedback results.
          QA_ROOM="aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa"
          QA_HOST="cccccccc-cccc-4ccc-8ccc-cccccccccccc"
          QA_LIBRARY="eeeeeeee-eeee-4eee-8eee-eeeeeeeeeeee"

          curl --fail-with-body -sS -X POST "$BASE/api/results/save"             -H "Content-Type: application/json"             -d "{\"room\":\"$QA_ROOM\",\"host_token\":\"$QA_HOST\",\"library_token\":\"$QA_LIBRARY\",\"title\":\"QA Production Feedback Result\",\"display_settings\":{\"show_people\":true,\"reveal_mode\":false}}"             -o /tmp/result-save.json
          jq -e '.ok == true and (.participant_count | tonumber) >= 1 and (.id | type == "string")' /tmp/result-save.json >/dev/null
          RESULT_ID=$(jq -r '.id' /tmp/result-save.json)

          curl --fail-with-body -sS "$BASE/api/results?library_token=$QA_LIBRARY" -o /tmp/result-list.json
          jq -e --arg id "$RESULT_ID" '.ok == true and any(.results[]; .id == $id and .title == "QA Production Feedback Result")' /tmp/result-list.json >/dev/null

          curl --fail-with-body -sS "$BASE/api/results/item?library_token=$QA_LIBRARY&result_id=$RESULT_ID" -o /tmp/result-item.json
          jq -e '.ok == true and .result.participant_count >= 1 and (.result.responses | length) >= 1' /tmp/result-item.json >/dev/null

          curl --fail-with-body -sS -X POST "$BASE/api/results/rename"             -H "Content-Type: application/json"             -d "{\"library_token\":\"$QA_LIBRARY\",\"result_id\":\"$RESULT_ID\",\"title\":\"QA Production Renamed\"}"             -o /tmp/result-rename.json
          jq -e '.ok == true' /tmp/result-rename.json >/dev/null

          curl --fail-with-body -sS -X POST "$BASE/api/results/delete"             -H "Content-Type: application/json"             -d "{\"library_token\":\"$QA_LIBRARY\",\"result_id\":\"$RESULT_ID\"}"             -o /tmp/result-delete.json
          jq -e '.ok == true' /tmp/result-delete.json >/dev/null

          curl --fail-with-body -sS "$BASE/api/results?library_token=$QA_LIBRARY" -o /tmp/result-after-delete.json
          jq -e --arg id "$RESULT_ID" '.ok == true and all(.results[]; .id != $id)' /tmp/result-after-delete.json >/dev/null
          echo "PRODUCTION_RESULT_HISTORY_OK"
