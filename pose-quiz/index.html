                                            {(preview.errors || []).map((msg, i) => <div key={'e'+i} className="mb-2 p-2 rounded-lg bg-amber-50 text-amber-700 text-xs font-bold">ℹ {msg}</div>)}
                                            <div className="max-h-[390px] overflow-auto border border-slate-100 rounded-xl">
                                                <table className="w-full text-xs">
                                                    <thead className="sticky top-0 bg-slate-100 text-slate-600">
                                                        <tr><th className="p-2 text-left">Dòng</th><th className="p-2 text-left">Câu hỏi</th><th className="p-2 text-left">Đáp án</th><th className="p-2 text-left">Trạng thái</th></tr>
                                                    </thead>
                                                    <tbody>
                                                        {(preview.items || []).slice(0, 100).map((item, idx) => (
                                                            <tr key={idx} className={item.valid ? 'border-t border-slate-100' : 'border-t border-red-100 bg-red-50'}>
                                                                <td className="p-2 font-black">{item.row}</td>
                                                                <td className="p-2 font-bold text-slate-700">{item.question?.text}</td>
                                                                <td className="p-2 text-slate-500">{(item.question?.answers || []).map(a => a.text).join(' • ')}</td>
                                                                <td className="p-2">
                                                                    {item.valid ? <span className="text-emerald-600 font-black">Hợp lệ</span> : <span className="text-red-600 font-bold">{(item.errors || []).join(' ')}</span>}
                                                                </td>
                                                            </tr>
                                                        ))}
                                                    </tbody>
                                                </table>
                                            </div>
                                            {(preview.items || []).length > 100 && <div className="text-[11px] text-slate-400 mt-2 text-center">Đang hiển thị 100 dòng đầu; toàn bộ câu hợp lệ vẫn sẽ được nhập.</div>}
                                        </>
                                    )}
                                </section>

                                <section className="bg-slate-50 border border-slate-200 rounded-2xl p-4">
                                    <div className="font-black text-slate-700 mb-2">4. Cách đưa vào bài hiện tại</div>
                                    <div className="grid grid-cols-2 gap-2">
                                        <button onClick={() => setImportMode('replace')} className={'p-3 rounded-xl font-black border-2 ' + (importMode === 'replace' ? 'bg-orange-50 border-orange-400 text-orange-700' : 'bg-white border-slate-200 text-slate-500')}>Thay toàn bộ câu</button>
                                        <button onClick={() => setImportMode('append')} className={'p-3 rounded-xl font-black border-2 ' + (importMode === 'append' ? 'bg-orange-50 border-orange-400 text-orange-700' : 'bg-white border-slate-200 text-slate-500')}>Thêm vào cuối bài</button>
                                    </div>
                                    <button
                                        disabled={busy || !preview || !preview.valid_count || (preview.mapping_errors || []).length > 0}
                                        onClick={onApply}
                                        className="mt-3 w-full bg-orange-500 hover:bg-orange-400 disabled:opacity-40 text-white py-3.5 rounded-xl font-black text-lg shadow-lg"
                                    >
                                        ✓ NHẬP {preview?.valid_count || 0} CÂU HỢP LỆ
                                    </button>
                                </section>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const Editor = ({ settings, setSettings, setScreen, usage, onSaveCloud, onOpenCloud, onOpenBank, onSaveQuestionsToBank, onImported, cloudId }) => {
            const [qIdx, setQIdx] = useState(0);
            const [shareGroups, setShareGroups] = useState([]);
            const [importOpen, setImportOpen] = useState(false);
            const [importText, setImportText] = useState('');
            const [importBusy, setImportBusy] = useState(false);
            const [importPreview, setImportPreview] = useState(null);
            const [importMode, setImportMode] = useState('append');
            const [poseMapping, setPoseMapping] = useState({
                A: 'RAISE_LEFT',
                B: 'RAISE_RIGHT',
                C: 'BOTH_UP',
                D: 'CROSS_ARMS'
            });
            const q = settings.questions[qIdx] || settings.questions[0];

            useEffect(() => {
                backendRequest('groups.list')
                    .then((result) => setShareGroups(result.groups || []))
                    .catch(() => setShareGroups([]));
            }, []);

            const handleFile = async (e, callback) => {
                const file = e.target.files[0];
                if (!file) return;
                try {
                    const result = await backendRequest('media.upload', {}, file);
                    callback(result.asset, file.name);
                } catch (err) {
                    alert('Không tải được media: ' + err.message);
                } finally {
                    e.target.value = '';
                }
            };

            const openFastImport = () => {
                const onlyOne = (settings.questions || []).length === 1;
                const text = String(settings.questions?.[0]?.text || '');
                const looksLikeStarter = onlyOne && (/Nhập nội dung câu hỏi|Em hãy tạo dáng/i.test(text));
                setImportMode(looksLikeStarter ? 'replace' : 'append');
                setImportPreview(null);
                setImportOpen(true);
            };

            const closeFastImport = () => {
                if (importBusy) return;
                setImportOpen(false);
            };

            const analyzeImportPaste = async () => {
                setImportBusy(true);
                try {
                    const result = await backendRequest('questions.import.preview', {
                        text: importText,
                        pose_mapping: poseMapping
                    });
                    setImportPreview(result);
                } catch (err) {
                    alert('Không phân tích được nội dung: ' + err.message);
                } finally {
                    setImportBusy(false);
                }
            };

            const analyzeImportExcel = async (e) => {
                const file = e.target.files?.[0];
                if (!file) return;
                setImportBusy(true);
                try {
                    const result = await backendRequest('questions.import.preview', {
                        pose_mapping: poseMapping
                    }, file);
                    setImportPreview(result);
                } catch (err) {
                    alert('Không đọc được Excel: ' + err.message);
                } finally {
                    e.target.value = '';
                    setImportBusy(false);
                }
            };

            const changeImportPose = (letter, pose) => {
                setPoseMapping(prev => ({...prev, [letter]: pose}));
                setImportPreview(null);
            };

            const applyImportedQuestions = () => {
                const imported = (importPreview?.items || []).filter(item => item.valid).map(item => item.question);
                if (!imported.length) return alert('Không có câu hợp lệ để nhập.');
                if ((importPreview?.mapping_errors || []).length) return alert(importPreview.mapping_errors.join('\n'));
                const previousCount = (settings.questions || []).length;
                const nextQuestions = importMode === 'replace'
                    ? imported
                    : [...(settings.questions || []), ...imported];
                setSettings({...settings, questions: nextQuestions});
                setQIdx(importMode === 'replace' ? 0 : previousCount);
                setImportOpen(false);
                setImportPreview(null);
                setImportText('');
                alert('Đã nhập ' + imported.length + ' câu hỏi hợp lệ vào bài.');
            };

            const previewConfiguredAudio = (type) => {
                const src = mediaSrc(settings.audio?.[type]?.data);
                if (!src) {
                    if (type === 'correct' || type === 'wrong') {
                        playDefaultFeedbackTone(type === 'correct', settings.audio?.feedbackVolume ?? 0.9);
                    }
                    return;
                }
                const audio = new Audio(src);
                audio.volume = type === 'bgm'
                    ? Math.min(1, Math.max(0, Number(settings.audio?.bgmVolume ?? 0.3)))
                    : Math.min(1, Math.max(0, Number(settings.audio?.feedbackVolume ?? 0.9)));
                audio.play().catch(() => {});
            };

            const updateQuestion = (data) => {
                const nq = [...settings.questions];
                nq[qIdx] = { ...nq[qIdx], ...data };
                setSettings({ ...settings, questions: nq });
            };

            const updateAnswer = (idx, data) => {
                const nq = [...settings.questions];
                nq[qIdx].answers[idx] = { ...nq[qIdx].answers[idx], ...data };
                setSettings({ ...settings, questions: nq });
            };

            const exportData = async () => {
                try {
                    const result = await backendRequest('document.export', { data: settings });
                    const blob = new Blob([JSON.stringify(result.data, null, 2)], { type: 'application/json;charset=utf-8' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `ai_pose_quiz_${Date.now()}.json`;
                    a.click();
                    URL.revokeObjectURL(url);
                } catch (err) {
                    alert('Không xuất được dữ liệu: ' + err.message);
                }
            };

            const importData = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                try {
                    const result = await backendRequest('document.import', {}, file);
                    setSettings(result.data);
                    onImported?.();
                    alert('Đã nhập dữ liệu qua backend thành công.');
                } catch (err) {
                    alert('Không nhập được file: ' + err.message);
                } finally {
                    e.target.value = '';
                }
            };

            return (
                <div className="pose-editor w-full h-full flex flex-col bg-slate-50 text-slate-800">
                    <FastImportModal
                        open={importOpen}
                        onClose={closeFastImport}
                        importText={importText}
                        setImportText={setImportText}
                        busy={importBusy}
                        preview={importPreview}
                        onAnalyzePaste={analyzeImportPaste}
                        onExcel={analyzeImportExcel}
                        importMode={importMode}
                        setImportMode={setImportMode}
                        poseMapping={poseMapping}
                        onPoseChange={changeImportPose}
                        onApply={applyImportedQuestions}
                    />
                    <div className="pose-editor-header bg-white border-b-2 border-slate-200 p-4 flex justify-between items-center px-8 shadow-sm">
                        <div className="flex flex-col">
                            <h2 className="pose-editor-title text-2xl font-black text-indigo-600 uppercase tracking-tighter">THIẾT LẬP BÀI DẠY V9.9 CLOUD</h2>
                            <div className="pose-editor-title-fields flex gap-2 mt-1">
                                <input value={settings.subject || ''} onChange={(e) => setSettings({...settings, subject: e.target.value})} placeholder="Môn học (VD: Tin học)" className="w-48 max-w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-1 text-sm font-bold outline-none focus:border-indigo-300" />
                                <input value={settings.title || ''} onChange={(e) => setSettings({...settings, title: e.target.value})} placeholder="Tên bài dạy" className="w-80 max-w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-1 text-sm font-bold outline-none focus:border-indigo-300" />
                            </div>
                            <div className="flex items-center gap-2 mt-1">
                                <span className="text-[10px] font-bold text-emerald-600">☁️ {usage} media đang tham chiếu • Storage riêng tư</span>
                            </div>
                        </div>
                        <div className="pose-editor-actions flex gap-2 flex-wrap justify-end">
                            <button onClick={openFastImport} className="bg-orange-500 text-white px-4 py-2 rounded-xl font-black text-xs uppercase hover:bg-orange-400 shadow-md">⚡ Nhập nhanh</button>
                            <button onClick={onOpenBank} className="bg-violet-600 text-white px-4 py-2 rounded-xl font-bold text-xs uppercase hover:bg-violet-700 shadow-md">📚 Kho câu hỏi</button>
                            <button onClick={() => setScreen('GROUPS')} className="bg-fuchsia-600 text-white px-4 py-2 rounded-xl font-bold text-xs uppercase hover:bg-fuchsia-700 shadow-md">👥 Nhóm</button>
                            <button onClick={onOpenCloud} className="bg-sky-500 text-white px-4 py-2 rounded-xl font-bold text-xs uppercase hover:bg-sky-600 shadow-md">☁️ Thư viện</button>
                            <button onClick={onSaveCloud} className="bg-emerald-600 text-white px-4 py-2 rounded-xl font-bold text-xs uppercase hover:bg-emerald-700 shadow-md">{cloudId ? 'Cập nhật cloud' : 'Lưu cloud'}</button>
                            <button onClick={exportData} className="bg-blue-500 text-white px-4 py-2 rounded-xl font-bold text-xs uppercase hover:bg-blue-600 shadow-md">Lưu file (.json)</button>
                            <label className="bg-orange-500 text-white px-4 py-2 rounded-xl font-bold text-xs uppercase cursor-pointer flex items-center hover:bg-orange-600 shadow-md">
                                Mở file
                                <input type="file" accept=".json" className="hidden" onChange={importData} />
                            </label>
                            <button onClick={() => setScreen('MENU')} className="bg-indigo-600 text-white px-8 py-2 rounded-xl font-black uppercase hover:bg-indigo-700 shadow-md">Xong</button>
                        </div>
                    </div>

                    <div className="pose-editor-body flex-1 flex overflow-hidden">
                        <div className="pose-editor-sidebar w-80 bg-white border-r border-slate-200 p-5 overflow-y-auto flex flex-col gap-6 shadow-inner">
                            <section>
                                <h3 className="text-xs font-black text-slate-400 uppercase mb-4 border-b pb-2 tracking-widest">⚙️ Thiết lập chung</h3>
                                <div className="space-y-4 mb-6">
                                    <div>
                                        <label className="text-[9px] font-black text-slate-400 uppercase mb-1 block">TG mỗi câu (giây)</label>
                                        <input type="number" value={settings.timeLimit} onChange={(e) => setSettings({...settings, timeLimit: parseInt(e.target.value) || 20})} className="w-full p-2 bg-slate-50 rounded-xl border border-slate-200 font-bold" />
                                    </div>
                                    <div>
                                        <label className="text-[9px] font-black text-slate-400 uppercase mb-1 block">TG quét tự động (giây)</label>
                                        <input type="number" value={settings.checkInterval} onChange={(e) => setSettings({...settings, checkInterval: parseInt(e.target.value) || 3})} className="w-full p-2 bg-slate-50 rounded-xl border border-slate-200 font-bold" />
                                    </div>
                                </div>

                                <h4 className="text-[10px] font-black text-indigo-400 uppercase mb-3">📸 Ảnh đại diện tư thế AI</h4>
                                <div className="space-y-3">
                                    {Object.keys(DEFAULT_POSE_CONFIG).map(poseId => (
                                        <div key={poseId} className="flex items-center gap-3 p-2 bg-slate-50 rounded-xl border border-slate-100">
                                            <div className="w-10 h-10 bg-white rounded-lg flex items-center justify-center overflow-hidden border border-slate-200 flex-shrink-0">
                                                {settings.poseAssets[poseId] ? (
                                                    <img src={mediaSrc(settings.poseAssets[poseId])} className="w-full h-full object-contain" />
                                                ) : (
                                                    <span className="text-xl">{DEFAULT_POSE_CONFIG[poseId].icon}</span>
                                                )}
                                            </div>
                                            <div className="flex-1 min-w-0">
                                                <div className="text-[9px] font-bold text-slate-500 truncate">{DEFAULT_POSE_CONFIG[poseId].label}</div>
                                                <div className="flex gap-2">
                                                    <label className="text-[8px] font-black text-indigo-500 cursor-pointer hover:underline uppercase">
                                                        Tải ảnh
                                                        <input type="file" accept="image/*" className="hidden" onChange={(e) => handleFile(e, (data) => setSettings({...settings, poseAssets: {...settings.poseAssets, [poseId]: data}}))} />
                                                    </label>
                                                    {settings.poseAssets[poseId] && (
                                                        <button onClick={() => setSettings({...settings, poseAssets: {...settings.poseAssets, [poseId]: null}})} className="text-[8px] font-black text-red-500 uppercase">Xóa</button>
                                                    )}
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </section>
                            
                            <section>
                                <h3 className="text-xs font-black text-slate-400 uppercase mb-4 border-b pb-2 tracking-widest">🎨 Nền bài dạy</h3>
                                <div className="space-y-3">
                                    <div className="relative aspect-video rounded-2xl overflow-hidden border-2 border-dashed border-slate-200 bg-slate-50 flex items-center justify-center">
                                        {settings.theme?.background ? (
                                            <>
                                                <img src={mediaSrc(settings.theme.background)} className="absolute inset-0 w-full h-full object-cover" />
                                                <div className="absolute inset-0" style={{backgroundColor: 'rgba(248,250,252,' + (settings.theme?.overlay ?? 0.68) + ')'}}></div>
                                                <span className="relative z-10 text-[10px] font-black text-slate-600 bg-white/80 px-2 py-1 rounded-lg">XEM TRƯỚC NỀN</span>
                                            </>
                                        ) : <span className="text-xs font-bold text-slate-400">Chưa chọn ảnh nền</span>}
                                        <input
                                            type="file"
                                            accept="image/*"
                                            className="absolute inset-0 opacity-0 cursor-pointer z-20"
                                            onChange={(e) => handleFile(e, (data) => setSettings({...settings, theme: {...(settings.theme || {}), background: data, overlay: settings.theme?.overlay ?? 0.68, fit: settings.theme?.fit || 'cover'}}))}
                                        />
                                    </div>
                                    <div className="flex gap-2">
                                        <select value={settings.theme?.fit || 'cover'} onChange={(e) => setSettings({...settings, theme: {...(settings.theme || {}), fit: e.target.value}})} className="flex-1 p-2 bg-slate-50 border border-slate-200 rounded-xl text-[10px] font-black">
                                            <option value="cover">Phủ kín nền</option>
                                            <option value="contain">Hiện đủ ảnh</option>
                                        </select>
                                        {settings.theme?.background && <button onClick={() => setSettings({...settings, theme: {...(settings.theme || {}), background: null}})} className="px-3 rounded-xl bg-red-50 text-red-600 text-[9px] font-black">XÓA NỀN</button>}
                                    </div>
                                    <label className="block text-[9px] font-black text-slate-500 uppercase">
                                        Độ phủ trắng: {Math.round((settings.theme?.overlay ?? 0.68) * 100)}%
                                        <input type="range" min="20" max="95" value={Math.round((settings.theme?.overlay ?? 0.68) * 100)} onChange={(e) => setSettings({...settings, theme: {...(settings.theme || {}), overlay: Number(e.target.value) / 100}})} className="w-full mt-1" />
                                    </label>
                                </div>
                            </section>

                            <section>
                                <h3 className="text-xs font-black text-slate-400 uppercase mb-4 border-b pb-2 tracking-widest">🎵 Âm thanh toàn bài</h3>
                                <div className="space-y-2">
                                    {['bgm', 'correct', 'wrong'].map(type => (
                                        <div key={type} className="bg-slate-50 p-2 rounded-xl border border-slate-100 text-[10px]">
                                            <label className="font-bold text-slate-500 block mb-1 uppercase">{type === 'bgm' ? 'Nhạc nền' : type === 'correct' ? 'Âm Đúng' : 'Âm Sai'}</label>
                                            <div className="relative h-8 border border-dashed border-slate-300 rounded-lg flex items-center justify-center font-bold text-slate-400 cursor-pointer overflow-hidden px-1 text-center">
                                                {settings.audio?.[type]?.name
                                                    ? settings.audio[type].name
                                                    : type === 'bgm'
                                                        ? '+ Chọn nhạc nền'
                                                        : 'Âm mặc định • bấm để thay'}
                                                <input type="file" accept="audio/*" className="absolute inset-0 opacity-0 cursor-pointer" onChange={(e) => handleFile(e, (data, name) => setSettings({...settings, audio: {...settings.audio, [type]: {data, name}}}))} />
                                            </div>
                                            <div className="flex gap-2 mt-1">
                                                {(settings.audio?.[type]?.data || (type !== 'bgm' && settings.audio?.defaultFeedback !== false)) && (
                                                    <button type="button" onClick={() => previewConfiguredAudio(type)} className="text-[8px] font-black text-indigo-500 uppercase">▶ Nghe thử</button>
                                                )}
                                                {settings.audio?.[type]?.data && (
                                                    <button type="button" onClick={() => setSettings({...settings, audio: {...settings.audio, [type]: {data: null, name: ""}}})} className="text-[8px] font-black text-red-500 uppercase">Dùng mặc định</button>
                                                )}
                                            </div>
                                        </div>
                                    ))}

                                    <label className="block bg-slate-50 p-2 rounded-xl text-[9px] font-black text-slate-500 uppercase">
                                        Nhạc nền: {Math.round((settings.audio?.bgmVolume ?? 0.3) * 100)}%
                                        <input type="range" min="0" max="100" value={Math.round((settings.audio?.bgmVolume ?? 0.3) * 100)} onChange={(e) => setSettings({...settings, audio: {...settings.audio, bgmVolume: Number(e.target.value) / 100}})} className="w-full mt-1" />
                                    </label>
                                    <label className="block bg-slate-50 p-2 rounded-xl text-[9px] font-black text-slate-500 uppercase">
                                        Đúng / sai: {Math.round((settings.audio?.feedbackVolume ?? 0.9) * 100)}%
                                        <input type="range" min="0" max="100" value={Math.round((settings.audio?.feedbackVolume ?? 0.9) * 100)} onChange={(e) => setSettings({...settings, audio: {...settings.audio, feedbackVolume: Number(e.target.value) / 100}})} className="w-full mt-1" />
                                    </label>
                                    <label className="block bg-slate-50 p-2 rounded-xl text-[9px] font-black text-slate-500 uppercase">
                                        Âm câu hỏi: {Math.round((settings.audio?.questionVolume ?? 1) * 100)}%
                                        <input type="range" min="0" max="100" value={Math.round((settings.audio?.questionVolume ?? 1) * 100)} onChange={(e) => setSettings({...settings, audio: {...settings.audio, questionVolume: Number(e.target.value) / 100}})} className="w-full mt-1" />
                                    </label>
                                    <label className="flex items-center gap-2 bg-amber-50 border border-amber-100 p-2 rounded-xl text-[9px] font-black text-amber-700 uppercase cursor-pointer">
                                        <input type="checkbox" checked={settings.audio?.defaultFeedback !== false} onChange={(e) => setSettings({...settings, audio: {...settings.audio, defaultFeedback: e.target.checked}})} />
                                        Dùng âm đúng/sai mặc định khi chưa tải file
                                    </label>
                                </div>
                            </section>

                            <section>
                                <h3 className="text-xs font-black text-slate-400 uppercase mb-4 border-b pb-2 tracking-widest">📚 Câu hỏi</h3>
                                <div className="flex flex-col gap-2">
                                    {settings.questions.map((_, i) => (
                                        <button key={i} onClick={() => setQIdx(i)} className={`w-full p-3 rounded-xl font-black text-xs transition-all ${qIdx === i ? 'bg-indigo-600 text-white shadow-lg' : 'bg-slate-50 text-slate-500'}`}>CÂU HỎI {i + 1}</button>
                                    ))}
                                    <button onClick={() => setSettings({...settings, questions: [...settings.questions, { id: Date.now(), text: "Em hãy tạo dáng mới nào!", image: null, audio: { data: null, name: "" }, answers: Array(4).fill(0).map((_, idx) => ({ text: `Đáp án ${idx + 1}`, pose: "NONE", isCorrect: idx === 0, image: null })) }]})} className="p-3 border-2 border-dashed border-indigo-200 text-indigo-600 rounded-xl font-black text-xs hover:bg-indigo-50">+ Thêm câu</button>
                                    <div className="grid grid-cols-1 gap-2 pt-2 border-t border-slate-100">
                                        <div className="text-[9px] font-black text-slate-400 uppercase tracking-widest mt-1">Chế độ lưu vào kho</div>
                                        <select value={settings.bankVisibility || 'private'} onChange={(e) => setSettings({...settings, bankVisibility: e.target.value, bankGroupId: e.target.value === 'group' ? (settings.bankGroupId || '') : ''})} className="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl text-[10px] font-black outline-none">
                                            <option value="private">🔒 Riêng tư — chỉ tôi</option>
                                            <option value="public">🌐 Công khai — mọi tài khoản</option>
                                            <option value="group">👥 Theo nhóm riêng</option>
                                        </select>
                                        {(settings.bankVisibility || 'private') === 'group' && (
                                            <select value={settings.bankGroupId || ''} onChange={(e) => setSettings({...settings, bankGroupId: e.target.value})} className="w-full p-2 bg-fuchsia-50 border border-fuchsia-100 text-fuchsia-700 rounded-xl text-[10px] font-black outline-none">
                                                <option value="">-- Chọn nhóm chia sẻ --</option>
                                                {shareGroups.map(group => <option key={group.id} value={group.id}>{group.name} ({group.join_code})</option>)}
                                            </select>
                                        )}
                                        <button disabled={!q} onClick={() => q && onSaveQuestionsToBank([q])} className="p-2.5 bg-violet-50 text-violet-700 border border-violet-100 rounded-xl font-black text-[10px] uppercase disabled:opacity-40">Lưu câu này vào kho</button>
                                        <button onClick={() => onSaveQuestionsToBank(settings.questions)} className="p-2.5 bg-violet-600 text-white rounded-xl font-black text-[10px] uppercase shadow-sm">Lưu tất cả vào kho</button>
                                        <button onClick={onOpenBank} className="p-2.5 bg-white text-violet-700 border-2 border-violet-200 rounded-xl font-black text-[10px] uppercase">Mở kho để lấy nhiều câu</button>
                                    </div>
                                </div>
                            </section>
                        </div>

                        <div className="pose-editor-content flex-1 p-6 overflow-y-auto bg-slate-50">
                            {q && (
                                <div className="pose-editor-question-card bg-white p-6 rounded-[2.5rem] shadow-sm space-y-6 max-w-5xl mx-auto border border-slate-200">
                                    <div className="pose-editor-question-head flex gap-6">
                                        <div className="flex-1">
                                            <label className="text-xs font-black text-slate-400 uppercase block mb-1 tracking-widest">Câu hỏi</label>
                                            <textarea value={q.text} onChange={(e) => updateQuestion({text: e.target.value})} className="w-full border-2 border-slate-50 p-4 rounded-[1.5rem] text-xl font-black bg-slate-50 outline-none focus:border-indigo-300 min-h-[100px]" />
                                            <div className="mt-3 flex items-center gap-2">
                                                <label className="relative flex-1 bg-amber-50 border-2 border-dashed border-amber-200 text-amber-700 rounded-xl px-4 py-2.5 font-black text-xs cursor-pointer text-center overflow-hidden">
                                                    {q.audio?.name ? `🔊 ${q.audio.name}` : '🔊 Thêm âm thanh cho câu hỏi'}
                                                    <input type="file" accept="audio/*" className="absolute inset-0 opacity-0 cursor-pointer" onChange={(e) => handleFile(e, (data, name) => updateQuestion({audio: {data, name}}))} />
                                                </label>
                                                {q.audio?.data && (
                                                    <>
                                                        <button type="button" onClick={() => new Audio(mediaSrc(q.audio.data)).play().catch(() => {})} className="px-3 py-2.5 rounded-xl bg-amber-500 text-white font-black text-xs">▶ NGHE</button>
                                                        <button type="button" onClick={() => updateQuestion({audio: {data: null, name: ""}})} className="px-3 py-2.5 rounded-xl bg-red-50 border border-red-100 text-red-600 font-black text-xs">XÓA</button>
                                                    </>
                                                )}
                                            </div>
                                        </div>
                                        <div className="pose-editor-question-image w-40 flex flex-col gap-2">
                                            <label className="text-xs font-black text-slate-400 uppercase block tracking-widest text-center">Ảnh minh họa</label>
                                            <div className="relative aspect-square bg-slate-50 rounded-2xl border-2 border-dashed border-slate-200 overflow-hidden flex flex-col items-center justify-center">
                                                {q.image ? <><img src={mediaSrc(q.image)} className="w-full h-full object-contain" /><button type="button" onClick={() => updateQuestion({image: null})} className="absolute top-1 right-1 z-20 bg-red-500 text-white w-6 h-6 rounded-full flex items-center justify-center font-bold shadow-lg">✕</button></> : <span className="text-2xl opacity-30 font-black">🖼️</span>}
                                                <input type="file" accept="image/*" className="absolute inset-0 z-10 opacity-0 cursor-pointer" onChange={(e) => handleFile(e, (data) => updateQuestion({image: data}))} />
                                            </div>
                                        </div>
                                    </div>

                                    <div className="pose-editor-answers grid grid-cols-2 gap-4">
                                        {q.answers.slice(0, settings.numAnswers).map((ans, idx) => (
                                            <div key={idx} className={`p-4 rounded-3xl border-2 transition-all ${ans.isCorrect ? 'border-green-500 bg-green-50/20 shadow-md ring-4 ring-green-50' : 'border-slate-100 bg-white'}`}>
                                                <div className="flex justify-between items-center mb-2">
                                                    <span className="font-black text-indigo-600 text-[10px]">ĐÁP ÁN {String.fromCharCode(65+idx)}</span>
                                                    <button onClick={() => { const nq = [...settings.questions]; nq[qIdx].answers.forEach((a, i) => a.isCorrect = i === idx); setSettings({...settings, questions: nq}); }} className={`px-3 py-0.5 rounded-full text-[9px] font-black ${ans.isCorrect ? 'bg-green-500 text-white' : 'bg-slate-100 text-slate-400'}`}>{ans.isCorrect ? '✓ ĐÚNG' : 'CHỌN LÀM ĐÚNG'}</button>
                                                </div>
                                                <input value={ans.text} onChange={(e) => updateAnswer(idx, {text: e.target.value})} className="w-full bg-transparent border-b border-slate-100 font-bold p-1 mb-2 outline-none text-sm focus:border-indigo-300" placeholder="Nhập mô tả..." />
                                                
                                                <div className="flex gap-3">
                                                    <div className="flex-1 space-y-2">
                                                        <select value={ans.pose} onChange={(e) => updateAnswer(idx, {pose: e.target.value})} className="w-full p-2 bg-slate-50 rounded-xl text-[10px] font-black border-none outline-none appearance-none">
                                                            {Object.keys(DEFAULT_POSE_CONFIG).map(pId => <option key={pId} value={pId}>{DEFAULT_POSE_CONFIG[pId].label}</option>)}
                                                        </select>
                                                        <div className="relative h-8 bg-indigo-50 rounded-xl flex items-center justify-center text-[9px] font-black text-indigo-600 border border-indigo-100 cursor-pointer">
                                                            {ans.image ? '📎 Đổi ảnh' : '📸 Thêm ảnh riêng'}
                                                            <input type="file" accept="image/*" className="absolute inset-0 opacity-0 cursor-pointer" onChange={(e) => handleFile(e, (data) => updateAnswer(idx, {image: data}))} />
                                                        </div>
                                                        {ans.image && (
                                                            <button type="button" onClick={() => updateAnswer(idx, {image: null})} className="w-full text-[8px] font-black text-red-500 uppercase">Xóa ảnh đáp án</button>
                                                        )}
                                                    </div>
                                                    <div className="w-16 h-16 bg-white rounded-xl border border-slate-100 flex items-center justify-center overflow-hidden relative shadow-inner">
                                                        {ans.image ? <img src={mediaSrc(ans.image)} className="w-full h-full object-contain" /> : (
                                                            settings.poseAssets[ans.pose] ? <img src={mediaSrc(settings.poseAssets[ans.pose])} className="w-full h-full object-contain" /> : <span className="text-2xl">{DEFAULT_POSE_CONFIG[ans.pose]?.icon}</span>
                                                        )}
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                    <button onClick={() => { if(settings.questions.length > 1) { const nq = settings.questions.filter((_, i) => i !== qIdx); setSettings({...settings, questions: nq}); setQIdx(0); } }} className="w-full py-3 text-red-500 font-black uppercase text-xs border border-red-100 rounded-xl hover:bg-red-50">Xóa câu hỏi này</button>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const Result = ({ score, total, setScreen }) => (
            <div className="w-full h-full flex flex-col items-center justify-center bg-white text-center p-6 bg-gradient-to-b from-indigo-50 to-white">
                <div className="text-[10rem] mb-4 animate-bounce drop-shadow-2xl">🏆</div>
                <h2 className="text-6xl font-black text-slate-800 mb-2 uppercase tracking-tighter">XUẤT SẮC!</h2>
                <div className="text-8xl font-black text-indigo-600 mb-10 bg-white px-12 py-4 rounded-[3rem] shadow-xl border-b-8 border-indigo-100">{score}/{total}</div>
                <button onClick={() => setScreen('MENU')} className="bg-indigo-600 text-white px-16 py-5 rounded-[2.5rem] text-3xl font-black shadow-2xl hover:scale-105 transition-all uppercase">Chơi lại thôi!</button>
            </div>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
