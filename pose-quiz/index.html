<body>
    <a class="portal-home-fab" href="/" title="Về Cổng công cụ giáo viên">🏠 <span class="portal-home-label">Cổng giáo viên</span></a>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo, useCallback } = React;

        const SUPABASE_CONFIG = window.POSE_QUIZ_SUPABASE;
        const supabaseClient = window.supabase.createClient(
            SUPABASE_CONFIG.url,
            SUPABASE_CONFIG.publishableKey,
            {
                auth: {
                    persistSession: true,
                    autoRefreshToken: true,
                    detectSessionInUrl: true
                }
            }
        );

        const API_URL = SUPABASE_CONFIG.url + '/functions/v1/pose-quiz-api';

        const mediaSrc = (value) => {
            if (!value) return null;
            if (typeof value === 'string') return value;
            return value.url || value.signedUrl || null;
        };

        const DEFAULT_AUDIO_ASSETS = {
            bgm: { url: '/pose-quiz/assets/default-bgm.mp3', name: 'Nhạc nền mặc định' },
            correct: { url: '/pose-quiz/assets/default-correct.mp3', name: 'Âm trả lời đúng mặc định' },
            wrong: { url: '/pose-quiz/assets/default-wrong.mp3', name: 'Âm trả lời sai mặc định' }
        };

        const resolvedLessonAudioSrc = (settings, type) => {
            const customSrc = mediaSrc(settings?.audio?.[type]?.data);
            if (customSrc) return customSrc;
            if ((type === 'correct' || type === 'wrong') && settings?.audio?.defaultFeedback === false) return null;
            return DEFAULT_AUDIO_ASSETS[type]?.url || null;
        };

        const backendRequest = async (action, payload = {}, file = null) => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session?.access_token) throw new Error('Phiên đăng nhập đã hết hạn.');

            const options = {
                method: 'POST',
                headers: {
                    Authorization: `Bearer ${session.access_token}`,
                    apikey: SUPABASE_CONFIG.publishableKey
                }
            };

            if (file) {
                const form = new FormData();
                form.append('file', file);
                if (payload && Object.keys(payload).length) form.append('payload', JSON.stringify(payload));
                options.body = form;
            } else {
                options.headers['Content-Type'] = 'application/json';
                options.body = JSON.stringify({ action, ...payload });
            }

            const response = await fetch(API_URL + '?action=' + encodeURIComponent(action), options);
            let result;
            try {
                result = await response.json();
            } catch {
                throw new Error('Backend trả về dữ liệu không hợp lệ.');
            }
            if (!response.ok || result?.ok === false) {
                throw new Error(result?.error?.message || `Lỗi backend (${response.status})`);
            }
            return result;
        };

        const DEFAULT_POSE_CONFIG = {
            NONE: { label: 'Bình thường', icon: '🧍', image: '/pose-quiz/assets/default-pose-none.webp' },
            RAISE_LEFT: { label: 'Giơ tay trái', icon: '🙋‍♂️', image: '/pose-quiz/assets/default-pose-raise-left.webp' },
            RAISE_RIGHT: { label: 'Giơ tay phải', icon: '🙋‍♀️', image: '/pose-quiz/assets/default-pose-raise-right.webp' },
            BOTH_UP: { label: 'Giơ hai tay', icon: '🙌', image: '/pose-quiz/assets/default-pose-both-up.webp' },
            CROSS_ARMS: { label: 'Khoanh tay', icon: '🙅', image: '/pose-quiz/assets/default-pose-cross-arms.webp' }
        };

        const resolvedPoseAssetSrc = (settings, poseId) => (
            mediaSrc(settings?.poseAssets?.[poseId]) || DEFAULT_POSE_CONFIG[poseId]?.image || null
        );

        let sharedAudioContext = null;
        const unlockAudio = () => {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return null;
                if (!sharedAudioContext) sharedAudioContext = new AudioCtx();
                if (sharedAudioContext.state === 'suspended') sharedAudioContext.resume().catch(() => {});
                return sharedAudioContext;
            } catch (_) {
                return null;
            }
        };

        const playDefaultFeedbackTone = (isCorrect, volume = 0.9) => {
            const ctx = unlockAudio();
            if (!ctx) return;
            try {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                const now = ctx.currentTime;
                osc.type = isCorrect ? 'sine' : 'triangle';
                osc.frequency.setValueAtTime(isCorrect ? 660 : 220, now);
                if (isCorrect) osc.frequency.exponentialRampToValueAtTime(990, now + 0.16);
                else osc.frequency.exponentialRampToValueAtTime(150, now + 0.22);
                gain.gain.setValueAtTime(Math.max(0.02, Math.min(1, volume)) * 0.22, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + (isCorrect ? 0.28 : 0.38));
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now);
                osc.stop(now + (isCorrect ? 0.3 : 0.4));
            } catch (_) {}
        };

        const analyzePose = (landmarks) => {
            if (!landmarks) return 'NONE';
            const leftWrist = landmarks[15];
            const rightWrist = landmarks[16];
            const leftShoulder = landmarks[11];
            const rightShoulder = landmarks[12];
            
            const isLeftUp = leftWrist.y < leftShoulder.y;
            const isRightUp = rightWrist.y < rightShoulder.y;

            if (isLeftUp && isRightUp) return 'BOTH_UP';
            if (isLeftUp) return 'RAISE_LEFT';
            if (isRightUp) return 'RAISE_RIGHT';

            const wristDistance = Math.sqrt(
                Math.pow(leftWrist.x - rightWrist.x, 2) + 
                Math.pow(leftWrist.y - rightWrist.y, 2)
            );
            if (wristDistance < 0.15) return 'CROSS_ARMS';

            return 'NONE';
        };

        const clamp01 = (value) => Math.max(0, Math.min(1, Number(value) || 0));
        const IMPORTANT_POSE_POINTS = [11, 12, 13, 14, 15, 16, 23, 24];

        const buildPoseDetection = (landmarks, index) => {
            const usable = (landmarks || []).filter(point =>
                Number.isFinite(point?.x) &&
                Number.isFinite(point?.y) &&
                (Number.isFinite(point?.visibility) ? point.visibility >= 0.2 : true)
            );
            if (!usable.length) return null;

            const xs = usable.map(point => clamp01(point.x));
            const ys = usable.map(point => clamp01(point.y));
            const padX = 0.035;
            const padY = 0.04;
            const minX = clamp01(Math.min(...xs) - padX);
            const maxX = clamp01(Math.max(...xs) + padX);
            const minY = clamp01(Math.min(...ys) - padY);
            const maxY = clamp01(Math.max(...ys) + padY);
            const width = Math.max(0.02, maxX - minX);
            const height = Math.max(0.02, maxY - minY);
            const shoulderWidth = landmarks?.[11] && landmarks?.[12]
                ? Math.hypot(landmarks[11].x - landmarks[12].x, landmarks[11].y - landmarks[12].y)
                : 0;

            return {
                index,
                landmarks,
                box: {
                    minX, maxX, minY, maxY, width, height,
                    cx: (minX + maxX) / 2,
                    cy: (minY + maxY) / 2
                },
                shoulderWidth
            };
        };

        const getPoseQuality = (detection) => {
            if (!detection) return { ok: false, level: 'lost', label: 'Không thấy học sinh đã chọn' };
            const landmarks = detection.landmarks || [];
            const important = IMPORTANT_POSE_POINTS.map(index => landmarks[index]).filter(Boolean);
            const visibleCount = important.filter(point => !Number.isFinite(point.visibility) || point.visibility >= 0.45).length;
            const visibilityAvg = important.length
                ? important.reduce((sum, point) => sum + (Number.isFinite(point.visibility) ? point.visibility : 1), 0) / important.length
                : 0;

            if (detection.box.height < 0.28 || detection.shoulderWidth < 0.055) {
                return { ok: false, level: 'far', label: 'Hơi xa camera — mời học sinh tiến gần hơn' };
            }
            if (detection.box.height > 0.96) {
                return { ok: false, level: 'near', label: 'Quá gần camera — lùi lại một chút' };
            }
            if (visibleCount < 6 || visibilityAvg < 0.45) {
                return { ok: false, level: 'occluded', label: 'Cơ thể bị che/khuất — cần thấy rõ vai, tay và hông' };
            }
            return { ok: true, level: 'good', label: 'Khoảng cách tốt — AI đã sẵn sàng nhận tư thế' };
        };

        // Khóa VÙNG TRẢ LỜI, không khóa danh tính học sinh.
        // Vùng được lưu bằng tọa độ chuẩn hóa 0..1 nên không thay đổi khi canvas/video đổi kích thước.
        const getTorsoCenter = (detection) => {
            if (!detection) return null;
            const landmarks = detection.landmarks || [];
            const torsoPoints = [11, 12, 23, 24]
                .map(index => landmarks[index])
                .filter(point =>
                    point &&
                    Number.isFinite(point.x) &&
                    Number.isFinite(point.y) &&
                    (!Number.isFinite(point.visibility) || point.visibility >= 0.25)
                );

            if (torsoPoints.length >= 2) {
                return {
                    x: clamp01(torsoPoints.reduce((sum, point) => sum + point.x, 0) / torsoPoints.length),
                    y: clamp01(torsoPoints.reduce((sum, point) => sum + point.y, 0) / torsoPoints.length)
                };
            }

            return {
                x: detection.box?.cx ?? 0.5,
                y: detection.box?.cy ?? 0.5
            };
        };

        const buildLockedAnswerRegion = (detection) => {
            if (!detection?.box) return null;
            const box = detection.box;
            const width = Math.min(0.58, Math.max(0.28, box.width * 1.22));
            const height = Math.min(0.96, Math.max(0.56, box.height * 1.12));
            let minX = box.cx - width / 2;
            let maxX = box.cx + width / 2;
            let minY = box.cy - height / 2;
            let maxY = box.cy + height / 2;

            if (minX < 0) { maxX -= minX; minX = 0; }
            if (maxX > 1) { minX -= (maxX - 1); maxX = 1; }
            if (minY < 0) { maxY -= minY; minY = 0; }
            if (maxY > 1) { minY -= (maxY - 1); maxY = 1; }

            minX = clamp01(minX);
            maxX = clamp01(maxX);
            minY = clamp01(minY);
            maxY = clamp01(maxY);

            return {
                minX, maxX, minY, maxY,
                width: Math.max(0.02, maxX - minX),
                height: Math.max(0.02, maxY - minY),
                cx: (minX + maxX) / 2,
                cy: (minY + maxY) / 2
            };
        };

        const isDetectionInsideLockedRegion = (detection, region) => {
            if (!detection || !region) return false;
            const center = getTorsoCenter(detection);
            if (!center) return false;
            return center.x >= region.minX &&
                center.x <= region.maxX &&
                center.y >= region.minY &&
                center.y <= region.maxY;
        };

        const pickDetectionInLockedRegion = (region, detections) => {
            if (!region || !detections?.length) return null;
            return detections
                .filter(detection => isDetectionInsideLockedRegion(detection, region))
                .map(detection => {
                    const center = getTorsoCenter(detection);
                    return {
                        detection,
                        distance: Math.hypot(center.x - region.cx, center.y - region.cy)
                    };
                })
                .sort((a, b) => a.distance - b.distance)[0]?.detection || null;
        };

        const drawPoseSkeleton = (ctx, detection, color) => {
            if (!ctx || !detection) return;
            ctx.save();
            try {
                drawConnectors(ctx, detection.landmarks, POSE_CONNECTIONS, {
                    color,
                    lineWidth: 4
                });
                drawLandmarks(ctx, detection.landmarks, {
                    color: '#ffffff',
                    lineWidth: 1,
                    radius: 3
                });
            } catch (_) {}
            ctx.restore();
        };

        const drawLockedAnswerRegion = (ctx, region, color, label, active = false) => {
            if (!ctx || !region) return;
            const width = ctx.canvas.width;
            const height = ctx.canvas.height;
            const x = region.minX * width;
            const y = region.minY * height;
            const w = region.width * width;
            const h = region.height * height;

            ctx.save();
            ctx.strokeStyle = color;
            ctx.lineWidth = active ? 6 : 5;
            ctx.setLineDash(active ? [] : [12, 8]);
            ctx.strokeRect(x, y, w, h);
            ctx.setLineDash([]);
            ctx.fillStyle = active ? 'rgba(34,197,94,0.08)' : 'rgba(245,158,11,0.10)';
            ctx.fillRect(x, y, w, h);

            if (label) {
                ctx.font = '800 18px Quicksand, sans-serif';
                const textWidth = ctx.measureText(label).width;
                const labelW = Math.max(120, textWidth + 22);
                const labelH = 32;
                const labelX = Math.max(0, Math.min(width - labelW, x));
                const labelY = Math.max(0, y - labelH);
                ctx.fillStyle = color;
                ctx.fillRect(labelX, labelY, labelW, labelH);
                ctx.fillStyle = '#ffffff';
                ctx.textBaseline = 'middle';
                ctx.save();
                ctx.translate(labelX + labelW, 0);
                ctx.scale(-1, 1);
                ctx.fillText(label, 10, labelY + labelH / 2);
                ctx.restore();
            }
            ctx.restore();
        };

        const drawDetection = (ctx, detection, color, label, strong = false) => {
            if (!ctx || !detection) return;
            const width = ctx.canvas.width;
            const height = ctx.canvas.height;
            const box = detection.box;
            const x = box.minX * width;
            const y = box.minY * height;
            const w = box.width * width;
            const h = box.height * height;

            ctx.save();
            try {
                drawConnectors(ctx, detection.landmarks, POSE_CONNECTIONS, {
                    color,
                    lineWidth: strong ? 4 : 2
                });
                drawLandmarks(ctx, detection.landmarks, {
                    color: strong ? '#ffffff' : color,
                    lineWidth: 1,
                    radius: strong ? 3 : 2
                });
            } catch (_) {}

            ctx.strokeStyle = color;
            ctx.lineWidth = strong ? 5 : 3;
            ctx.setLineDash(strong ? [] : [8, 5]);
            ctx.strokeRect(x, y, w, h);
            ctx.setLineDash([]);

            if (label) {
                ctx.font = '800 18px Quicksand, sans-serif';
                const textWidth = ctx.measureText(label).width;
                const labelW = Math.max(70, textWidth + 20);
                const labelH = 30;
                const labelX = Math.max(0, Math.min(width - labelW, x));
                const labelY = Math.max(0, y - labelH);
                ctx.fillStyle = color;
                ctx.fillRect(labelX, labelY, labelW, labelH);
                ctx.fillStyle = '#ffffff';
                ctx.textBaseline = 'middle';

                // Canvas được lật gương bằng CSS để khớp với video camera.
                // Vẽ chữ lật trước một lần để sau khi CSS mirror, nhãn HS 1/HS 2...
                // và ĐÃ KHÓA/GIỮ VỊ TRÍ hiển thị đúng chiều cho giáo viên.
                ctx.save();
                ctx.translate(labelX + labelW, 0);
                ctx.scale(-1, 1);
                ctx.fillText(label, 10, labelY + labelH / 2);
                ctx.restore();
            }
            ctx.restore();
        };



        const AuthScreen = () => {
            const [mode, setMode] = useState('login');
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [busy, setBusy] = useState(false);
            const [message, setMessage] = useState('');

            const submit = async (e) => {
                e.preventDefault();
                setBusy(true);
                setMessage('');
                try {
                    if (mode === 'login') {
                        const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
                        if (error) throw error;
                    } else {
                        const { data, error } = await supabaseClient.auth.signUp({
                            email,
                            password,
                            options: { emailRedirectTo: window.location.href.split(/[?#]/)[0] }
                        });
                        if (error) throw error;
                        if (!data.session) {
                            setMessage('Đã gửi email xác nhận. Hãy mở email để hoàn tất đăng ký rồi đăng nhập.');
                        }
                    }
                } catch (err) {
                    setMessage(err?.message || 'Không thể xác thực tài khoản.');
                } finally {
                    setBusy(false);
                }

                            source: shareFilter,
                            search: searchText
                        }),
                        backendRequest('groups.list')
                    ]);
                    setItems(bankResult.items || []);
                    setSubjects(bankResult.facets?.subjects || []);
                    setLessons(bankResult.facets?.lessons || []);
                    setGroups(groupResult.groups || []);

                    setError(err.message || 'Không tải được kho câu hỏi.');
                } finally {
                    setLoading(false);

            useEffect(() => {
                const timer = setTimeout(() => load(), 180);
                return () => clearTimeout(timer);

            const groupNames = useMemo(
                () => Object.fromEntries(groups.map(group => [group.id, group.name])),
                [groups]

                    setLessonFilter('ALL');
                }

                setSelected(prev => {
                    const next = new Set(prev);
                    if (next.has(id)) next.delete(id);
                    else next.add(id);
                    return next;
                });
            };

            const toggleAllVisible = () => {
                const ids = visibleItems.map(item => item.id);

                    ids.forEach(id => allSelected ? next.delete(id) : next.add(id));
                    return next;

                        const bankQuestionId = ids[index] || question.bankQuestionId || null;

                                <option value="ALL">Tất cả bài</option>
                                {lessons.map(lesson => <option key={lesson} value={lesson}>{lesson}</option>)}
                            </select>
                            <select value={shareFilter} onChange={(e) => setShareFilter(e.target.value)} className="px-3 py-2 rounded-xl border border-slate-200 bg-slate-50 font-bold text-sm">
                                <option value="ALL">Tất cả nguồn</option>

                                <option value="PUBLIC">Công khai</option>

        const App = () => {

            const storageUsage = useMemo(() => {
                const paths = new Set();
                const walk = (value) => {
                    if (Array.isArray(value)) return value.forEach(walk);
                    if (!value || typeof value !== 'object') return;
                    if (value.path) paths.add(value.path);
                    Object.values(value).forEach(walk);

                return paths.size;

            const saveQuestionsToBank = async (questions) => {

                    alert('Không lưu được bài dạy: ' + err.message);

            const newLesson = () => {

                    subject: 'Tin học',

                    }],
                    audio: {
                        correct: { data: null, name: '' },
                        wrong: { data: null, name: '' },
                        bgm: { data: null, name: '' },
                        bgmVolume: 0.3,
                        feedbackVolume: 0.9,
                        questionVolume: 1,

                    },

                        background: null,
                        overlay: 0.68,
                        fit: 'cover'

                setScreen('EDITOR');

            if (!authReady) {
                return <div className="w-screen h-screen grid place-items-center bg-slate-950 text-white font-black text-xl">Đang kết nối Supabase...</div>;

            if (!session) return <AuthScreen />;

            if (!backendReady) {
                return (
                    <div className="w-screen h-screen bg-slate-950 text-white grid place-items-center p-6 text-center">
                        <div>
                            <div className="text-6xl mb-4">⚙️</div>
                            <div className="text-xl font-black">{backendError ? 'Không kết nối được backend' : 'Đang khởi tạo backend...'}</div>
                            {backendError && <div className="mt-3 text-red-300 font-bold max-w-xl">{backendError}</div>}
                            {backendError && <button onClick={() => window.location.reload()} className="mt-5 bg-indigo-600 px-5 py-2 rounded-xl font-black">THỬ LẠI</button>}
                        </div>
                    </div>
                );
            }

            return (
                <div className="w-screen h-screen bg-white overflow-hidden select-none">
                    {screen === 'MENU' && <MainMenu setScreen={setScreen} user={session.user} onSignOut={() => supabaseClient.auth.signOut()} />}
                    {screen === 'GAME' && <Game settings={settings} setScreen={setScreen} setScore={setScore} />}
                    {screen === 'EDITOR' && <Editor settings={settings} setSettings={setSettings} setScreen={setScreen} usage={storageUsage} onSaveCloud={saveToCloud} onOpenCloud={() => setScreen('CLOUD')} onOpenBank={() => setScreen('BANK')} onSaveQuestionsToBank={saveQuestionsToBank} onImported={() => setCloudId(null)} cloudId={cloudId} />}
                    {screen === 'CLOUD' && <CloudLibrary setScreen={setScreen} setSettings={setSettings} setCloudId={setCloudId} onNewLesson={newLesson} />}
                    {screen === 'BANK' && <QuestionBank setScreen={setScreen} settings={settings} setSettings={setSettings} user={session.user} />}
                    {screen === 'GROUPS' && <GroupManager setScreen={setScreen} user={session.user} />}
                    {screen === 'RESULT' && <Result score={score} total={settings.questions.length} setScreen={setScreen} />}
                </div>

        };

        const MainMenu = ({ setScreen, user, onSignOut }) => (
            <div className="w-full h-full flex flex-col items-center justify-center bg-gradient-to-br from-indigo-600 to-purple-700 text-white p-4 text-center relative">
                <div className="absolute top-5 right-6 flex items-center gap-3 bg-white/10 border border-white/20 rounded-2xl px-4 py-2 backdrop-blur">
                    <span className="text-xs font-bold max-w-56 truncate">{user?.email}</span>

                    <div className="grid grid-cols-2 gap-3">
                        <button onClick={() => setScreen('EDITOR')} className="bg-white/10 hover:bg-white/20 py-3.5 rounded-2xl text-base font-black backdrop-blur-md border border-white/30 transition-all uppercase">✏️ Soạn bài</button>
                        <button onClick={() => setScreen('BANK')} className="bg-violet-500/90 hover:bg-violet-400 py-3.5 rounded-2xl text-base font-black shadow-lg transition-all uppercase">📚 Ngân hàng câu hỏi</button>
                        <button onClick={() => setScreen('GROUPS')} className="bg-fuchsia-500/90 hover:bg-fuchsia-400 py-3.5 rounded-2xl text-base font-black shadow-lg transition-all uppercase">👥 Nhóm chia sẻ</button>
                        <button onClick={() => setScreen('CLOUD')} className="bg-sky-500/90 hover:bg-sky-400 py-3.5 rounded-2xl text-base font-black shadow-lg transition-all uppercase">☁️ Bài dạy đã lưu</button>

        );

        const Game = ({ settings, setScreen, setScore }) => {
            const [qIndex, setQIndex] = useState(0);
            const [timeLeft, setTimeLeft] = useState(settings.timeLimit);
            const [checkTimer, setCheckTimer] = useState(settings.checkInterval || 20);
            const [detectedPose, setDetectedPose] = useState('NONE');
            const [feedback, setFeedback] = useState(null);
            const [answerScanStarted, setAnswerScanStarted] = useState(false);
            const [correctCount, setCorrectCount] = useState(0);
            const [bgmGameVolume, setBgmGameVolume] = useState(() => Math.min(1, Math.max(0, Number(settings.audio?.bgmVolume ?? 0.3))));
            const [feedbackGameVolume, setFeedbackGameVolume] = useState(() => Math.min(1, Math.max(0, Number(settings.audio?.feedbackVolume ?? 0.9))));
            const [voiceGameVolume, setVoiceGameVolume] = useState(() => Math.min(1, Math.max(0, Number(settings.voiceNarration?.volume ?? settings.audio?.questionVolume ?? 1))));
            const [showVolumeControl, setShowVolumeControl] = useState(false);
            const allGameAudioMuted = bgmGameVolume <= 0.001 && feedbackGameVolume <= 0.001 && (!settings.voiceNarration?.enabled || voiceGameVolume <= 0.001);
            const [isPaused, setIsPaused] = useState(false);
            const [voiceBusy, setVoiceBusy] = useState(false);
            const [calledStudent, setCalledStudent] = useState(null);
            const [voiceStatus, setVoiceStatus] = useState('');
            const [gameToken, setGameToken] = useState(null);
            const [gameReady, setGameReady] = useState(false);
            const [gameError, setGameError] = useState('');
            const [poseError, setPoseError] = useState('');
            const [peopleCount, setPeopleCount] = useState(0);
            const [selectionMode, setSelectionMode] = useState(true);
            const [targetStatus, setTargetStatus] = useState('SELECTING');
            const [targetQuality, setTargetQuality] = useState({ ok: false, level: 'waiting', label: 'Chọn học sinh cần nhận diện' });
            const checkInFlightRef = useRef(false);
            const isPausedRef = useRef(false);
            const pendingResultRef = useRef(null);
            const feedbackTimeoutRef = useRef(null);
            const voiceRuntimeRef = useRef(null);
            const voiceLoadedRef = useRef(false);
            const voiceRunIdRef = useRef(0);
            const presentedQuestionRef = useRef('');
            const currentStudentRef = useRef(null);
            
            const videoRef = useRef(null);
            const canvasRef = useRef(null);
            const poseRef = useRef(null);
            const poseLandmarkerRef = useRef(null);
            const cameraRef = useRef(null);
            const bgmRef = useRef(null);
            const feedbackAudioRef = useRef(null);
            const questionAudioRef = useRef(null);
            const isMounted = useRef(true);
            const detectionsRef = useRef([]);
            const lockedRegionRef = useRef(null);
            const selectionModeRef = useRef(true);
            const lastPeopleUiUpdateRef = useRef(0);
            const lastQualityUiUpdateRef = useRef(0);
            const lastVideoTimestampRef = useRef(0);

            const currentQuestion = settings.questions[qIndex];
            const answerPoseIds = useMemo(() => new Set(
                (currentQuestion?.answers || [])
                    .slice(0, settings.numAnswers)
                    .map(answer => answer?.pose)
                    .filter(pose => pose && pose !== 'NONE')
            ), [currentQuestion, settings.numAnswers]);
            const recognitionBlocked = selectionMode || targetStatus !== 'LOCKED' || !targetQuality.ok || !!poseError || voiceBusy;
            const lessonBackground = mediaSrc(settings.theme?.background);
            const lessonOverlay = Math.min(0.95, Math.max(0.2, Number(settings.theme?.overlay ?? 0.68)));
            const lessonBackgroundFit = settings.theme?.fit === 'contain' ? 'contain' : 'cover';

            // Cập nhật âm lượng ngay trên từng sự kiện input khi đang kéo thanh trượt.
            // Không chờ mouseup/touchend hoặc vòng render/effect tiếp theo mới áp dụng vào audio đang phát.
            const updateBgmGameVolume = useCallback((rawValue) => {
                const next = Math.min(1, Math.max(0, Number(rawValue) / 100));
                if (bgmRef.current) bgmRef.current.volume = next;
                setBgmGameVolume(next);
            }, []);

            const updateFeedbackGameVolume = useCallback((rawValue) => {
                const next = Math.min(1, Math.max(0, Number(rawValue) / 100));
                if (feedbackAudioRef.current) feedbackAudioRef.current.volume = next;
                setFeedbackGameVolume(next);
            }, []);

            const updateVoiceGameVolume = useCallback((rawValue) => {
                const next = Math.min(1, Math.max(0, Number(rawValue) / 100));
                voiceRuntimeRef.current?.setVolume?.(next);
                setVoiceGameVolume(next);
            }, []);

            const muteAllGameAudio = useCallback(() => {
                if (bgmRef.current) bgmRef.current.volume = 0;
                if (feedbackAudioRef.current) feedbackAudioRef.current.volume = 0;
                voiceRuntimeRef.current?.setVolume?.(0);
                setBgmGameVolume(0);
                setFeedbackGameVolume(0);
                setVoiceGameVolume(0);
            }, []);

            const skipNarration = useCallback(() => {
                voiceRunIdRef.current += 1;
                voiceRuntimeRef.current?.stop?.();
                setVoiceBusy(false);
                setVoiceStatus('⏭ Đã bỏ qua lời đọc — học sinh có thể trả lời.');
            }, []);

            const getPoseVisual = (poseId) => {
                const src = resolvedPoseAssetSrc(settings, poseId);
                if (src) {
                    return <img src={src} className="w-full h-full object-contain" />;
                }
                return <span className="text-4xl">{DEFAULT_POSE_CONFIG[poseId]?.icon || '❓'}</span>;
            };

            useEffect(() => {
                let cancelled = false;
                setGameReady(false);
                setGameError('');
                backendRequest('game.start', { data: settings })
                    .then((result) => {
                        if (cancelled) return;
                        setGameToken(result.game_token);
                        setQIndex(result.index || 0);
                        setCorrectCount(result.score || 0);
                        setGameReady(true);
                    })
                    .catch((err) => {
                        if (!cancelled) setGameError(err.message || 'Không tạo được phiên chơi.');
                    });
                return () => { cancelled = true; };
            }, []);

            const applyCheckedResult = useCallback((result) => {
                if (!isMounted.current) return;
                pendingResultRef.current = null;
                if (feedbackTimeoutRef.current) {
                    clearTimeout(feedbackTimeoutRef.current);
                    feedbackTimeoutRef.current = null;
                }
                if (result.finished) {
                    setScore(result.score || 0);
                    setScreen('RESULT');
                } else {
                    setGameToken(result.game_token);
                    setQIndex(result.next_index);
                    setTimeLeft(settings.timeLimit);
                    setCheckTimer(settings.checkInterval || 20);
                    setAnswerScanStarted(false);
                    setFeedback(null);
                    checkInFlightRef.current = false;
                }
            }, [settings.timeLimit, settings.checkInterval, setScore, setScreen]);

            const scheduleCheckedResult = useCallback((result, delay = 1500) => {
                pendingResultRef.current = result;
                if (feedbackTimeoutRef.current) clearTimeout(feedbackTimeoutRef.current);
                feedbackTimeoutRef.current = setTimeout(() => {
                    feedbackTimeoutRef.current = null;
                    if (!isMounted.current || isPausedRef.current) return;
                    applyCheckedResult(result);
                }, delay);
            }, [applyCheckedResult]);

            const checkAnswer = useCallback(async () => {
                if (feedback || !gameReady || !gameToken || checkInFlightRef.current || recognitionBlocked || !answerScanStarted) return;
                checkInFlightRef.current = true;
                try {
                    const result = await backendRequest('game.check', {
                        game_token: gameToken,
                        detected_pose: detectedPose
                    });

                    const isCorrect = result.feedback === 'correct';
                    setFeedback(result.feedback);
                    setCorrectCount(result.score || 0);

                    if (questionAudioRef.current) {
                        questionAudioRef.current.pause();
                        questionAudioRef.current.currentTime = 0;
                    }
                    const audioSrc = resolvedLessonAudioSrc(settings, isCorrect ? 'correct' : 'wrong');
                    if (feedbackAudioRef.current) {
                        try { feedbackAudioRef.current.pause(); } catch (_) {}
                        feedbackAudioRef.current = null;
                    }
                    if (feedbackGameVolume > 0.001 && audioSrc) {
                        const feedbackAudio = new Audio(audioSrc);
                        feedbackAudioRef.current = feedbackAudio;
                        feedbackAudio.volume = feedbackGameVolume;
                        feedbackAudio.play().catch(() => {
                            if (settings.audio.defaultFeedback !== false) playDefaultFeedbackTone(isCorrect, feedbackGameVolume);
                        });
                    } else if (feedbackGameVolume > 0.001 && settings.audio.defaultFeedback !== false) {
                        playDefaultFeedbackTone(isCorrect, feedbackGameVolume);
                    }

                    if (settings.voiceNarration?.enabled && voiceRuntimeRef.current) {
                        setVoiceBusy(true);
                        try {
                            await voiceRuntimeRef.current.result(currentQuestion, currentStudentRef.current, isCorrect);
                            if (result.finished) await voiceRuntimeRef.current.summary(result.score || 0, result.total || settings.questions.length);
                        } catch (voiceErr) {
                            setVoiceStatus('⚠ Lỗi lời nhận xét: ' + (voiceErr.message || voiceErr));
                        } finally {
                            setVoiceBusy(false);
                        }
                        scheduleCheckedResult(result, 350);
                    } else {
                        scheduleCheckedResult(result, 1500);
                    }
                } catch (err) {
                    checkInFlightRef.current = false;
                    alert('Backend không chấm được câu hỏi: ' + err.message);
                }
            }, [feedback, gameReady, gameToken, detectedPose, feedbackGameVolume, settings, scheduleCheckedResult, recognitionBlocked, currentQuestion, answerScanStarted]);

            // Hàm xử lý khi nhấn nút Kiểm tra
            const handleManualCheck = () => {
                if (isPaused || feedback || !gameReady || checkInFlightRef.current || recognitionBlocked || !answerScanStarted) return;
                setTimeLeft(0);
            };

            const togglePause = () => setIsPaused(prev => !prev);

            const backToEditor = () => {
                voiceRunIdRef.current += 1;
                voiceRuntimeRef.current?.stop?.();
                if (bgmRef.current) {
                    try { bgmRef.current.pause(); } catch (_) {}
                    bgmRef.current = null;
                }
                if (feedbackAudioRef.current) {
                    try { feedbackAudioRef.current.pause(); } catch (_) {}
                    feedbackAudioRef.current = null;
                }
                setScreen('EDITOR');
            };

            useEffect(() => {
                isPausedRef.current = isPaused;
                if (isPaused) {
                    if (feedbackTimeoutRef.current) {
                        clearTimeout(feedbackTimeoutRef.current);
                        feedbackTimeoutRef.current = null;
                    }
                } else if (pendingResultRef.current) {
                    scheduleCheckedResult(pendingResultRef.current, 350);
                }
            }, [isPaused, scheduleCheckedResult]);

            useEffect(() => () => {
                if (feedbackTimeoutRef.current) clearTimeout(feedbackTimeoutRef.current);
            }, []);

            // Tạo nhạc nền đúng một lần cho mỗi nguồn âm thanh.
            // Kéo thanh âm lượng chỉ đổi .volume của Audio đang phát, KHÔNG tạo Audio mới
            // nên bài nhạc không bị tắt/chạy lại từ đầu trong lúc kéo.
            useEffect(() => {
                if (bgmRef.current) {
                    try { bgmRef.current.pause(); } catch (_) {}
                    bgmRef.current = null;
                }

                const bgmSrc = resolvedLessonAudioSrc(settings, 'bgm');
                if (!bgmSrc) return;

                const audio = new Audio(bgmSrc);
                audio.loop = true;
                audio.volume = bgmGameVolume;
                bgmRef.current = audio;

                if (!isPaused) {
                    audio.play().catch(() => {});
                }

                return () => {
                    if (bgmRef.current === audio) {
                        try { audio.pause(); } catch (_) {}
                        bgmRef.current = null;
                    } else {
                        try { audio.pause(); } catch (_) {}
                    }
                };
            }, [settings.audio.bgm?.data]);

            // Giọng đọc câu hỏi do PoseQuizVoiceRuntime quản lý. Khi tắt "Sử dụng giọng đọc",
            // không phát audio câu hỏi cũ; nhạc nền và hiệu ứng đúng/sai vẫn giữ nguyên.
            useEffect(() => {
                if (questionAudioRef.current) {
                    questionAudioRef.current.pause();
                    questionAudioRef.current = null;
                }
            }, [qIndex, settings.voiceNarration?.enabled]);

            useEffect(() => {
                if (!settings.voiceNarration?.enabled) {
                    voiceRunIdRef.current += 1;
                    voiceRuntimeRef.current?.stop?.();
                    voiceLoadedRef.current = false;
                    presentedQuestionRef.current = '';
                    currentStudentRef.current = null;
                    setCalledStudent(null);
                    setVoiceBusy(false);
                    setVoiceStatus('');
                    return;
                }
                if (!voiceRuntimeRef.current) {
                    voiceRuntimeRef.current = window.PoseQuizVoiceRuntime.create({client: supabaseClient, volume: voiceGameVolume});
                }
                voiceRuntimeRef.current.setVolume(voiceGameVolume);
            }, [settings.voiceNarration?.enabled, voiceGameVolume]);

            useEffect(() => {
                if (!settings.voiceNarration?.enabled || !gameReady || !currentQuestion || feedback) return;
                const key = String(qIndex) + ':' + String(currentQuestion.id || '');
                if (presentedQuestionRef.current === key) return;

                const runId = ++voiceRunIdRef.current;
                const play = async () => {
                    setVoiceBusy(true);
                    try {
                        const runtime = voiceRuntimeRef.current || window.PoseQuizVoiceRuntime.create({client: supabaseClient, volume: voiceGameVolume});
                        voiceRuntimeRef.current = runtime;
                        runtime.setVolume(voiceGameVolume);

                        if (!voiceLoadedRef.current) {
                            const info = await runtime.load(settings);
                            if (voiceRunIdRef.current !== runId) return;
                            voiceLoadedRef.current = true;
                            setVoiceStatus('🎙️ '+info.voiceLabel+' · '+info.scriptTitle+(info.classSize ? ' · '+info.classSize+' HS · '+info.studentVoiceCount+' tên có WAV' : ' · Không gọi tên HS')+' · '+info.questionAudioCount+' WAV câu hỏi');
                        }

                        if (voiceRunIdRef.current !== runId) return;
                        presentedQuestionRef.current = key;

                        const presented = await runtime.presentQuestion(currentQuestion, qIndex, {
                            intro: qIndex === 0,
                            onStudent: (student) => {
                                if (voiceRunIdRef.current !== runId) return;
                                currentStudentRef.current = student || null;
                                setCalledStudent(student || null);
                            }
                        });

                        if (voiceRunIdRef.current !== runId) return;
                        currentStudentRef.current = presented.student || null;
                    } catch (err) {
                        if (voiceRunIdRef.current === runId) {
                            setVoiceStatus('⚠ Không đọc được lời dẫn: '+(err.message || err));
                        }
                    } finally {
                        if (voiceRunIdRef.current === runId) {
                            setVoiceBusy(false);
                        }
                    }
                };

                play();

                return () => {
                    if (voiceRunIdRef.current === runId) {
                        voiceRunIdRef.current += 1;
                    }
                };
            }, [settings.voiceNarration?.enabled, gameReady, qIndex, currentQuestion?.id, feedback]);

            useEffect(() => {
                if (isPaused) {
                    if (bgmRef.current) {
                        try { bgmRef.current.pause(); } catch (_) {}
                    }
                    voiceRuntimeRef.current?.pause?.();
                } else {
                    if (bgmRef.current) {
                        bgmRef.current.play().catch(() => {});
                    }
                    voiceRuntimeRef.current?.resume?.();
                }
            }, [isPaused]);

            useEffect(() => {
                if (bgmRef.current) bgmRef.current.volume = bgmGameVolume;
            }, [bgmGameVolume]);

            useEffect(() => {
                if (feedbackAudioRef.current) feedbackAudioRef.current.volume = feedbackGameVolume;
            }, [feedbackGameVolume]);

            useEffect(() => {
                // Chỉ thay âm lượng của giọng đang phát. Tuyệt đối không đổi runId,
                // không stop narration và không thay voiceBusy khi kéo thanh âm lượng.
                voiceRuntimeRef.current?.setVolume?.(voiceGameVolume);
            }, [voiceGameVolume]);

            useEffect(() => () => {
                voiceRuntimeRef.current?.stop?.();
                if (feedbackAudioRef.current) {
                    try { feedbackAudioRef.current.pause(); } catch (_) {}
                    feedbackAudioRef.current = null;
                }
            }, []);

            useEffect(() => {
                selectionModeRef.current = selectionMode;
            }, [selectionMode]);

            const resetTargetSelection = useCallback(() => {
                selectionModeRef.current = true;
                setSelectionMode(true);
                setTargetStatus('SELECTING');
                setTargetQuality({ ok: false, level: 'waiting', label: 'Chọn vị trí học sinh sẽ đứng trả lời' });
                lockedRegionRef.current = null;
                setDetectedPose('NONE');
            }, []);

            const handleCanvasClick = useCallback((event) => {
                if (!selectionModeRef.current || !canvasRef.current) return;
                const detections = detectionsRef.current || [];
                if (!detections.length) return;

                const canvas = canvasRef.current;
                const rect = canvas.getBoundingClientRect();
                const sourceWidth = canvas.width || 640;
                const sourceHeight = canvas.height || 480;
                const scale = Math.min(rect.width / sourceWidth, rect.height / sourceHeight);
                const renderedWidth = sourceWidth * scale;
                const renderedHeight = sourceHeight * scale;
                const offsetX = (rect.width - renderedWidth) / 2;
                const offsetY = (rect.height - renderedHeight) / 2;

                const mirroredX = rect.right - event.clientX;
                const sourceX = (mirroredX - offsetX) / renderedWidth;
                const sourceY = (event.clientY - rect.top - offsetY) / renderedHeight;
                if (sourceX < 0 || sourceX > 1 || sourceY < 0 || sourceY > 1) return;

                let candidates = detections.filter(detection => (
                    sourceX >= detection.box.minX &&
                    sourceX <= detection.box.maxX &&
                    sourceY >= detection.box.minY &&
                    sourceY <= detection.box.maxY
                ));

                if (!candidates.length) {
                    candidates = detections
                        .map(detection => ({
                            detection,
                            distance: Math.hypot(sourceX - detection.box.cx, sourceY - detection.box.cy)
                        }))
                        .filter(item => item.distance <= 0.18)
                        .sort((a, b) => a.distance - b.distance)
                        .map(item => item.detection);
                } else {
                    candidates.sort((a, b) => (a.box.width * a.box.height) - (b.box.width * b.box.height));
                }

                const selected = candidates[0];
                if (!selected) return;

                const region = buildLockedAnswerRegion(selected);
                if (!region) return;

                lockedRegionRef.current = region;
                selectionModeRef.current = false;
                setSelectionMode(false);
                setTargetStatus('LOCKED');
                const quality = getPoseQuality(selected);
                setTargetQuality(quality);
                setDetectedPose(quality.ok ? analyzePose(selected.landmarks) : 'NONE');
            }, []);

            useEffect(() => {
                if (!gameReady) return;
                const videoElement = videoRef.current;
                if (!videoElement) return;

                let cancelled = false;
                isMounted.current = true;
                setPoseError('');

                const processPoseFrame = async () => {
                    if (
                        cancelled ||
                        !isMounted.current ||
                        !poseLandmarkerRef.current ||
                        !videoRef.current ||
                        videoRef.current.readyState < 2
                    ) return;

                    let timestamp = performance.now();
                    if (timestamp <= lastVideoTimestampRef.current) timestamp = lastVideoTimestampRef.current + 1;
                    lastVideoTimestampRef.current = timestamp;

                    let result;
                    try {
                        result = poseLandmarkerRef.current.detectForVideo(videoRef.current, timestamp);
                    } catch (detectError) {
                        console.warn('Pose frame skipped:', detectError);
                        return;
                    }

                    const detections = (result?.landmarks || [])
                        .slice(0, 5)
                        .map((landmarks, index) => buildPoseDetection(landmarks, index))
                        .filter(Boolean);
                    detectionsRef.current = detections;

                    const canvas = canvasRef.current;
                    if (!canvas) return;
                    const ctx = canvas.getContext('2d');
                    ctx.clearRect(0, 0, canvas.width, canvas.height);

                    const now = performance.now();
                    if (now - lastPeopleUiUpdateRef.current > 140) {
                        setPeopleCount(detections.length);
                        lastPeopleUiUpdateRef.current = now;
                    }

                    if (selectionModeRef.current) {
                        detections.forEach((detection, index) => {
                            drawDetection(ctx, detection, '#6366f1', 'HS ' + (index + 1), false);
                        });
                        return;
                    }

                    const region = lockedRegionRef.current;
                    const matched = pickDetectionInLockedRegion(region, detections);

                    if (matched) {
                        setTargetStatus('LOCKED');
                        const quality = getPoseQuality(matched);
                        if (now - lastQualityUiUpdateRef.current > 140) {
                            setTargetQuality(quality);
                            lastQualityUiUpdateRef.current = now;
                        }

                        drawPoseSkeleton(ctx, matched, quality.ok ? '#22c55e' : '#f59e0b');
                        drawLockedAnswerRegion(
                            ctx,
                            region,
                            quality.ok ? '#22c55e' : '#f59e0b',
                            quality.ok ? 'VÙNG TRẢ LỜI — SẴN SÀNG' : 'VÙNG TRẢ LỜI — ĐIỀU CHỈNH',
                            quality.ok
                        );
                        setDetectedPose(quality.ok ? analyzePose(matched.landmarks) : 'NONE');
                    } else {
                        setTargetStatus('WAITING');
                        setDetectedPose('NONE');
                        if (now - lastQualityUiUpdateRef.current > 140) {
                            setTargetQuality({
                                ok: false,
                                level: 'waiting',
                                label: 'Đang chờ học sinh quay lại vùng trả lời...'
                            });
                            lastQualityUiUpdateRef.current = now;
                        }
                        drawLockedAnswerRegion(
                            ctx,
                            region,
                            '#f59e0b',
                            'VÙNG TRẢ LỜI — ĐANG CHỜ',
                            false
                        );
                    }
                };

                const initPose = async () => {
                    // Camera phải được mở độc lập với AI. Nếu MediaPipe lỗi tải,
                    // giáo viên vẫn nhìn thấy hình camera và nhận được lỗi AI chính xác.
                    try {
                        cameraRef.current = new Camera(videoElement, {
                            onFrame: processPoseFrame,
                            width: 640,
                            height: 480
                        });
                        await cameraRef.current.start();
                    } catch (cameraError) {
                        console.error('Camera init failed:', cameraError);
                        if (!cancelled && isMounted.current) {
                            const reason = cameraError?.message ? String(cameraError.message).slice(0, 180) : 'Trình duyệt không mở được camera';
                            setPoseError('Không mở được camera: ' + reason);
                        }
                        return;
                    }

                    try {
                        // Đoạn này nằm trong script type="text/babel". Dùng Function để
                        // dynamic import được chính trình duyệt xử lý, tránh Babel đổi import() thành require().
                        const nativeImport = window.__poseNativeImport || (
                            window.__poseNativeImport = new Function('url', 'return import(url)')
                        );
                        const visionSources = [
                            {
                                module: 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/vision_bundle.mjs',
                                wasm: 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/wasm'
                            },
                            {
                                module: 'https://unpkg.com/@mediapipe/tasks-vision@0.10.21/vision_bundle.mjs',
                                wasm: 'https://unpkg.com/@mediapipe/tasks-vision@0.10.21/wasm'
                            }
                        ];

                        let visionModule = null;
                        let vision = null;
                        let lastVisionError = null;

                        for (const source of visionSources) {
                            try {
                                const imported = await nativeImport(source.module);
                                const api = imported?.default && imported.default.FilesetResolver
                                    ? imported.default
                                    : imported;
                                if (!api?.FilesetResolver || !api?.PoseLandmarker) {
                                    throw new Error('MediaPipe module không có FilesetResolver/PoseLandmarker');
                                }
                                const fileset = await api.FilesetResolver.forVisionTasks(source.wasm);
                                visionModule = api;
                                vision = fileset;
                                console.info('MediaPipe Tasks Vision loaded from:', source.module);
                                break;
                            } catch (sourceError) {
                                lastVisionError = sourceError;
                                console.warn('MediaPipe source failed:', source.module, sourceError);
                            }
                        }

                        if (!visionModule || !vision) {
                            throw new Error('Không tải được MediaPipe Tasks Vision: ' + (lastVisionError?.message || 'unknown error'));
                        }

                        const createLandmarker = async (delegate, modelAssetPath) => visionModule.PoseLandmarker.createFromOptions(vision, {
                            baseOptions: { modelAssetPath, delegate },
                            runningMode: 'VIDEO',
                            numPoses: 5,
                            minPoseDetectionConfidence: 0.45,
                            minPosePresenceConfidence: 0.45,
                            minTrackingConfidence: 0.5,
                            outputSegmentationMasks: false
                        });

                        let landmarker;
                        try {
                            landmarker = await createLandmarker(
                                'GPU',
                                'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/1/pose_landmarker_full.task'
                            );
                        } catch (gpuError) {
                            console.warn('Pose GPU unavailable, switching to CPU/Lite:', gpuError);
                            landmarker = await createLandmarker(
                                'CPU',
                                'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task'
                            );
                        }

                        if (cancelled || !isMounted.current) {
                            try { landmarker.close(); } catch (_) {}
                            return;
                        }

                        poseLandmarkerRef.current = landmarker;
                        resetTargetSelection();
                        setPoseError('');
                    } catch (err) {
                        console.error('Multi-pose init failed:', err);
                        if (!cancelled && isMounted.current) {
                            const reason = err?.message ? String(err.message).slice(0, 180) : 'Lỗi không xác định';
                            setPoseError('Camera đã mở nhưng AI đa học sinh chưa khởi tạo: ' + reason);
                        }
                    }
                };

                initPose();
                return () => {
                    cancelled = true;
                    isMounted.current = false;
                    detectionsRef.current = [];
                    lockedRegionRef.current = null;
                    if (cameraRef.current) {
                        try { cameraRef.current.stop(); } catch (_) {}
                        cameraRef.current = null;
                    }
                    if (poseLandmarkerRef.current) {
                        try { poseLandmarkerRef.current.close(); } catch (_) {}
                        poseLandmarkerRef.current = null;
                    }
                    if (poseRef.current) {
                        try { poseRef.current.close(); } catch (_) {}
                        poseRef.current = null;
                    }
                };
            }, [gameReady, resetTargetSelection]);

            // Giai đoạn đọc câu hỏi: chưa đếm thời gian/chưa quét.
            // Chỉ khi học sinh thực hiện một trong các tư thế đáp án thì mới bắt đầu quét.
            useEffect(() => {
                if (
                    answerScanStarted ||
                    !gameReady ||
                    gameError ||
                    feedback ||
                    isPaused ||
                    voiceBusy ||
                    recognitionBlocked
                ) return;

                if (answerPoseIds.has(detectedPose)) {
                    setAnswerScanStarted(true);
                    setCheckTimer(settings.checkInterval || 20);
                    setTimeLeft(settings.timeLimit);
                }
            }, [
                answerScanStarted,
                gameReady,
                gameError,
                feedback,
                isPaused,
                voiceBusy,
                recognitionBlocked,
                detectedPose,
                answerPoseIds,
                settings.checkInterval,
                settings.timeLimit
            ]);

            useEffect(() => {
                if (!answerScanStarted || !gameReady || gameError || feedback || isPaused || voiceBusy || recognitionBlocked) return;
                if (timeLeft <= 0) { checkAnswer(); return; }
                const timer = setInterval(() => setTimeLeft(prev => prev - 1), 1000);
                const intervalTimer = setInterval(() => {
                    setCheckTimer(prev => {
                        if (prev <= 1) { checkAnswer(); return settings.checkInterval || 20; }
                        return prev - 1;
                    });
                }, 1000);
                return () => { clearInterval(timer); clearInterval(intervalTimer); };
            }, [answerScanStarted, timeLeft, feedback, checkTimer, checkAnswer, settings.checkInterval, gameReady, gameError, isPaused, voiceBusy, recognitionBlocked]);

            if (!gameReady) {
                return (
                    <div className="w-full h-full bg-slate-950 text-white grid place-items-center p-6 text-center">
                        <div>
                            <div className="text-6xl mb-4">{gameError ? '⚠️' : '🎮'}</div>
                            <div className="text-2xl font-black">{gameError ? 'Không thể bắt đầu bài chơi' : 'Đang tạo phiên chơi trên backend...'}</div>
                            {gameError && <div className="mt-3 text-red-300 font-bold max-w-xl">{gameError}</div>}
                            <button onClick={() => setScreen('MENU')} className="mt-6 bg-indigo-600 hover:bg-indigo-500 px-6 py-3 rounded-xl font-black">← TRANG CHỦ</button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="w-full h-full flex flex-col bg-slate-100 overflow-hidden">
                    <div className="pose-game-header bg-indigo-700 px-6 py-1.5 text-white flex justify-between items-center shadow-lg z-20">
                        <div className="pose-game-header-left flex items-center gap-4">
                            <span className="pose-game-question-no text-xl font-black bg-white/20 px-5 py-1 rounded-xl">CÂU {qIndex + 1}</span>
                            <div className="relative">
                                <button
                                    onClick={() => setShowVolumeControl(prev => !prev)}
                                    className="pose-game-mute text-xl w-10 h-10 flex items-center justify-center bg-white/10 rounded-full hover:bg-white/20 transition-all"
                                    title="Điều chỉnh âm lượng"
                                    aria-label="Điều chỉnh âm lượng"
                                >
                                    {allGameAudioMuted ? '🔇' : '🎚️'}
                                </button>
                                {showVolumeControl && (
                                    <div className="pose-volume-popover absolute left-0 top-12 z-[100] w-72 bg-slate-950/95 text-white rounded-2xl p-3 shadow-2xl border border-white/15 backdrop-blur-md">
                                        <div className="text-[10px] font-black uppercase tracking-wider text-slate-300 mb-3">🎚️ Âm lượng trong trò chơi</div>

                                        <label className="block mb-3">
                                            <div className="flex items-center justify-between mb-1">
                                                <span className="text-[11px] font-black">🎵 Nhạc nền</span>
                                                <span className="text-[11px] font-black text-sky-300">{Math.round(bgmGameVolume * 100)}%</span>
                                            </div>
                                            <input
                                                type="range" min="0" max="100" step="1"
                                                value={Math.round(bgmGameVolume * 100)}
                                                onInput={(e) => updateBgmGameVolume(e.currentTarget.value)}
                                                className="w-full accent-sky-400 cursor-pointer"
                                                aria-label="Âm lượng nhạc nền"
                                            />
                                        </label>

                                        <label className="block mb-3">
                                            <div className="flex items-center justify-between mb-1">
                                                <span className="text-[11px] font-black">✅❌ Âm đúng / sai</span>
                                                <span className="text-[11px] font-black text-amber-300">{Math.round(feedbackGameVolume * 100)}%</span>
                                            </div>
                                            <input
                                                type="range" min="0" max="100" step="1"
                                                value={Math.round(feedbackGameVolume * 100)}
                                                onInput={(e) => updateFeedbackGameVolume(e.currentTarget.value)}
                                                className="w-full accent-amber-400 cursor-pointer"
                                                aria-label="Âm lượng đúng sai"
                                            />
                                        </label>

                                        <label className={`block ${settings.voiceNarration?.enabled ? '' : 'opacity-45'}`}>
                                            <div className="flex items-center justify-between mb-1">
                                                <span className="text-[11px] font-black">🎙️ Giọng đọc</span>
                                                <span className="text-[11px] font-black text-emerald-300">{settings.voiceNarration?.enabled ? Math.round(voiceGameVolume * 100) + '%' : 'Đang tắt'}</span>
                                            </div>
                                            <input
                                                type="range" min="0" max="100" step="1"
                                                value={Math.round(voiceGameVolume * 100)}
                                                onInput={(e) => updateVoiceGameVolume(e.currentTarget.value)}
                                                disabled={!settings.voiceNarration?.enabled}
                                                className="w-full accent-emerald-400 cursor-pointer disabled:cursor-not-allowed"
                                                aria-label="Âm lượng giọng đọc"
                                            />
                                        </label>

                                        <div className="mt-3 pt-2 border-t border-white/10 flex justify-between text-[9px] font-bold text-slate-400">
                                            <span>Kéo về 0% để tắt riêng</span>
                                            <button
                                                type="button"
                                                onClick={muteAllGameAudio}
                                                className="text-red-300 hover:text-red-200 font-black"
                                            >TẮT TẤT CẢ</button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                        <div className="pose-game-header-right flex items-center gap-6">
                            <div className="pose-game-timer flex flex-col items-center border-r border-white/20 pr-6">
                                <span className="pose-game-timer-label text-[10px] font-bold opacity-70 uppercase tracking-widest text-indigo-200">Quét sau</span>
                                <span className="pose-game-timer-value text-3xl font-black text-yellow-400 leading-none">{answerScanStarted ? `${checkTimer}s` : 'CHỜ'}</span>
                            </div>
                            <div className="flex flex-col items-center">

                    setImportBusy(false);

            };

                    const result = await backendRequest('questions.import.preview', {
                        pose_mapping: poseMapping
                    }, file);
                    setImportPreview(result);
                } catch (err) {
                    alert('Không đọc được Excel: ' + err.message);

                    e.target.value = '';

                                    <div className="pose-editor-question-head flex gap-6">
                                        <div className="flex-1">
                                            <label className="text-xs font-black text-slate-400 uppercase block mb-1 tracking-widest">Câu hỏi</label>
                                            <textarea value={q.text} onChange={(e) => updateQuestion({text: e.target.value})} className="w-full border-2 border-slate-50 p-4 rounded-[1.5rem] text-xl font-black bg-slate-50 outline-none focus:border-indigo-300 min-h-[100px]" />
                                            <div className="mt-3 flex items-center gap-2">
                                                <label className="relative flex-1 bg-amber-50 border-2 border-dashed border-amber-200 text-amber-700 rounded-xl px-4 py-2.5 font-black text-xs cursor-pointer text-center overflow-hidden">
                                                    {q.audio?.name ? `🔊 ${q.audio.name}` : '🔊 Thêm âm thanh cho câu hỏi'}
                                                    <input type="file" accept="audio/*" className="absolute inset-0 opacity-0 cursor-pointer" onChange={(e) => handleFile(e, (data, name) => updateQuestion({audio: {data, name}}))} />
                                                </label>
                                                {q.audio?.data && (
                                                    <>
                                                        <button type="button" onClick={() => new Audio(mediaSrc(q.audio.data)).play().catch(() => {})} className="px-3 py-2.5 rounded-xl bg-amber-500 text-white font-black text-xs">▶ NGHE</button>
                                                        <button type="button" onClick={() => updateQuestion({audio: {data: null, name: ""}})} className="px-3 py-2.5 rounded-xl bg-red-50 border border-red-100 text-red-600 font-black text-xs">XÓA</button>
                                                    </>
                                                )}
                                            </div>
                                        </div>
                                        <div className="pose-editor-question-image w-40 flex flex-col gap-2">
                                            <label className="text-xs font-black text-slate-400 uppercase block tracking-widest text-center">Ảnh minh họa</label>
                                            <div className="relative aspect-square bg-slate-50 rounded-2xl border-2 border-dashed border-slate-200 overflow-hidden flex flex-col items-center justify-center">
                                                {q.image ? <><img src={mediaSrc(q.image)} className="w-full h-full object-contain" /><button type="button" onClick={() => updateQuestion({image: null})} className="absolute top-1 right-1 z-20 bg-red-500 text-white w-6 h-6 rounded-full flex items-center justify-center font-bold shadow-lg">✕</button></> : <span className="text-2xl opacity-30 font-black">🖼️</span>}
                                                <input type="file" accept="image/*" className="absolute inset-0 z-10 opacity-0 cursor-pointer" onChange={(e) => handleFile(e, (data) => updateQuestion({image: data}))} />
                                            </div>
                                        </div>
                                    </div>

                                    <div className="pose-editor-answers grid grid-cols-2 gap-4">
                                        {q.answers.slice(0, settings.numAnswers).map((ans, idx) => (
                                            <div key={idx} className={`p-4 rounded-3xl border-2 transition-all ${ans.isCorrect ? 'border-green-500 bg-green-50/20 shadow-md ring-4 ring-green-50' : 'border-slate-100 bg-white'}`}>
                                                <div className="flex justify-between items-center mb-2">
                                                    <span className="font-black text-indigo-600 text-[10px]">ĐÁP ÁN {String.fromCharCode(65+idx)}</span>
                                                    <button onClick={() => { const nq = [...settings.questions]; nq[qIdx].answers.forEach((a, i) => a.isCorrect = i === idx); setSettings({...settings, questions: nq}); }} className={`px-3 py-0.5 rounded-full text-[9px] font-black ${ans.isCorrect ? 'bg-green-500 text-white' : 'bg-slate-100 text-slate-400'}`}>{ans.isCorrect ? '✓ ĐÚNG' : 'CHỌN LÀM ĐÚNG'}</button>
                                                </div>
                                                <input value={ans.text} onChange={(e) => updateAnswer(idx, {text: e.target.value})} className="w-full bg-transparent border-b border-slate-100 font-bold p-1 mb-2 outline-none text-sm focus:border-indigo-300" placeholder="Nhập mô tả..." />
                                                
                                                <div className="flex gap-3">
                                                    <div className="flex-1 space-y-2">
                                                        <select value={ans.pose} onChange={(e) => updateAnswer(idx, {pose: e.target.value})} className="w-full p-2 bg-slate-50 rounded-xl text-[10px] font-black border-none outline-none appearance-none">
                                                            {Object.keys(DEFAULT_POSE_CONFIG).map(pId => <option key={pId} value={pId}>{DEFAULT_POSE_CONFIG[pId].label}</option>)}
                                                        </select>
                                                        <div className="relative h-8 bg-indigo-50 rounded-xl flex items-center justify-center text-[9px] font-black text-indigo-600 border border-indigo-100 cursor-pointer">
                                                            {ans.image ? '📎 Đổi ảnh' : '📸 Thêm ảnh riêng'}
                                                            <input type="file" accept="image/*" className="absolute inset-0 opacity-0 cursor-pointer" onChange={(e) => handleFile(e, (data) => updateAnswer(idx, {image: data}))} />
                                                        </div>
                                                        {ans.image && (
                                                            <button type="button" onClick={() => updateAnswer(idx, {image: null})} className="w-full text-[8px] font-black text-red-500 uppercase">Xóa ảnh đáp án</button>
                                                        )}
                                                    </div>
                                                    <div className="w-16 h-16 bg-white rounded-xl border border-slate-100 flex items-center justify-center overflow-hidden relative shadow-inner">
                                                        {ans.image ? <img src={mediaSrc(ans.image)} className="w-full h-full object-contain" /> : (
                                                            resolvedPoseAssetSrc(settings, ans.pose) ? <img src={resolvedPoseAssetSrc(settings, ans.pose)} className="w-full h-full object-contain" /> : <span className="text-2xl">{DEFAULT_POSE_CONFIG[ans.pose]?.icon}</span>
                                                        )}
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                    <button onClick={() => { if(settings.questions.length > 1) { const nq = settings.questions.filter((_, i) => i !== qIdx); setSettings({...settings, questions: nq}); setQIdx(0); } }} className="w-full py-3 text-red-500 font-black uppercase text-xs border border-red-100 rounded-xl hover:bg-red-50">Xóa câu hỏi này</button>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const Result = ({ score, total, setScreen }) => (
            <div className="w-full h-full flex flex-col items-center justify-center bg-white text-center p-6 bg-gradient-to-b from-indigo-50 to-white">
                <div className="text-[10rem] mb-4 animate-bounce drop-shadow-2xl">🏆</div>
                <h2 className="text-6xl font-black text-slate-800 mb-2 uppercase tracking-tighter">XUẤT SẮC!</h2>
                <div className="text-8xl font-black text-indigo-600 mb-10 bg-white px-12 py-4 rounded-[3rem] shadow-xl border-b-8 border-indigo-100">{score}/{total}</div>
                <button onClick={() => setScreen('MENU')} className="bg-indigo-600 text-white px-16 py-5 rounded-[2.5rem] text-3xl font-black shadow-2xl hover:scale-105 transition-all uppercase">Chơi lại thôi!</button>
            </div>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
