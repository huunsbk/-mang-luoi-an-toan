    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap');

    .portal-home-fab{position:fixed;top:12px;left:12px;z-index:99999;padding:9px 12px;border-radius:12px;background:rgba(15,23,42,.92);color:#fff!important;text-decoration:none;font:800 13px/1.1 system-ui,-apple-system,Segoe UI,sans-serif;box-shadow:0 10px 30px rgba(15,23,42,.22);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.16)}

  .pose-answer-letter{width:34px!important;height:34px!important;margin-right:5px!important;font-size:17px!important;border-radius:11px!important}
  .pose-answer-text{font-size:11px!important;line-height:1.05!important;padding-right:2px!important}
  .pose-answer-visual{width:40px!important;height:40px!important;border-radius:10px!important;border-width:1px!important}
  .pose-camera-panel{width:100%!important;height:36%!important;min-height:0!important}

  .pose-editor{height:100vh!important;overflow-y:auto!important}

  .pose-editor-sidebar{width:100%!important;overflow:visible!important;padding:12px!important;box-shadow:none!important}
  .pose-editor-content{padding:10px!important;overflow:visible!important}
  .pose-editor-question-card{padding:12px!important;border-radius:20px!important}
  .pose-editor-question-head{flex-direction:column!important;gap:10px!important}

<body>
    <a class="portal-home-fab" href="/" title="Về Cổng công cụ giáo viên">🏠 <span class="portal-home-label">Cổng giáo viên</span></a>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo, useCallback } = React;

        const SUPABASE_CONFIG = window.POSE_QUIZ_SUPABASE;
        const supabaseClient = window.supabase.createClient(
            SUPABASE_CONFIG.url,
            SUPABASE_CONFIG.publishableKey,
            {
                auth: {
                    persistSession: true,
                    autoRefreshToken: true,
                    detectSessionInUrl: true
                }
            }
        );

        const API_URL = SUPABASE_CONFIG.url + '/functions/v1/pose-quiz-api';

        const mediaSrc = (value) => {
            if (!value) return null;
            if (typeof value === 'string') return value;
            return value.url || value.signedUrl || null;
        };

        const backendRequest = async (action, payload = {}, file = null) => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session?.access_token) throw new Error('Phiên đăng nhập đã hết hạn.');

            const options = {
                method: 'POST',
                headers: {
                    Authorization: `Bearer ${session.access_token}`,
                    apikey: SUPABASE_CONFIG.publishableKey
                }
            };

            if (file) {
                const form = new FormData();
                form.append('file', file);
                if (payload && Object.keys(payload).length) form.append('payload', JSON.stringify(payload));
                options.body = form;
                options.headers['x-pose-action'] = action;
            } else {
                options.headers['Content-Type'] = 'application/json';
                options.body = JSON.stringify({ action, ...payload });
            }

            const response = await fetch(API_URL + '?action=' + encodeURIComponent(action), options);
            let result;
            try {
                result = await response.json();
            } catch {
                throw new Error('Backend trả về dữ liệu không hợp lệ.');
            }
            if (!response.ok || result?.ok === false) {
                throw new Error(result?.error?.message || `Lỗi backend (${response.status})`);
            }
            return result;
        };

        const DEFAULT_POSE_CONFIG = {
            NONE: { label: 'Bình thường', icon: '🧍' },
            RAISE_LEFT: { label: 'Giơ tay trái', icon: '🙋‍♂️' },
            RAISE_RIGHT: { label: 'Giơ tay phải', icon: '🙋‍♀️' },
            BOTH_UP: { label: 'Giơ hai tay', icon: '🙌' },
            CROSS_ARMS: { label: 'Khoanh tay', icon: '🙅' }
        };

        let sharedAudioContext = null;
        const unlockAudio = () => {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return null;
                if (!sharedAudioContext) sharedAudioContext = new AudioCtx();
                if (sharedAudioContext.state === 'suspended') sharedAudioContext.resume().catch(() => {});
                return sharedAudioContext;
            } catch (_) {
                return null;
            }
        };

        const playDefaultFeedbackTone = (isCorrect, volume = 0.9) => {
            const ctx = unlockAudio();
            if (!ctx) return;
            try {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                const now = ctx.currentTime;
                osc.type = isCorrect ? 'sine' : 'triangle';
                osc.frequency.setValueAtTime(isCorrect ? 660 : 220, now);
                if (isCorrect) osc.frequency.exponentialRampToValueAtTime(990, now + 0.16);
                else osc.frequency.exponentialRampToValueAtTime(150, now + 0.22);
                gain.gain.setValueAtTime(Math.max(0.02, Math.min(1, volume)) * 0.22, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + (isCorrect ? 0.28 : 0.38));
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now);
                osc.stop(now + (isCorrect ? 0.3 : 0.4));
            } catch (_) {}
        };

        const analyzePose = (landmarks) => {
            if (!landmarks) return 'NONE';
            const leftWrist = landmarks[15];
            const rightWrist = landmarks[16];
            const leftShoulder = landmarks[11];
            const rightShoulder = landmarks[12];
            
            const isLeftUp = leftWrist.y < leftShoulder.y;
            const isRightUp = rightWrist.y < rightShoulder.y;

            if (isLeftUp && isRightUp) return 'BOTH_UP';
            if (isLeftUp) return 'RAISE_LEFT';
            if (isRightUp) return 'RAISE_RIGHT';

            const wristDistance = Math.sqrt(
                Math.pow(leftWrist.x - rightWrist.x, 2) + 
                Math.pow(leftWrist.y - rightWrist.y, 2)
            );
            if (wristDistance < 0.15) return 'CROSS_ARMS';

            return 'NONE';
        };


        const AuthScreen = () => {
            const [mode, setMode] = useState('login');
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [busy, setBusy] = useState(false);
            const [message, setMessage] = useState('');

            const submit = async (e) => {
                e.preventDefault();
                setBusy(true);
                setMessage('');
                try {
                    if (mode === 'login') {
                        const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
                        if (error) throw error;
                    } else {
                        const { data, error } = await supabaseClient.auth.signUp({
                            email,
                            password,
                            options: { emailRedirectTo: window.location.href.split(/[?#]/)[0] }
                        });
                        if (error) throw error;
                        if (!data.session) {
                            setMessage('Đã gửi email xác nhận. Hãy mở email để hoàn tất đăng ký rồi đăng nhập.');
                        }
                    }
                } catch (err) {
                    setMessage(err?.message || 'Không thể xác thực tài khoản.');
                } finally {
                    setBusy(false);
                }
            };

            return (
                <div className="w-screen h-screen bg-gradient-to-br from-indigo-700 via-purple-700 to-slate-900 flex items-center justify-center p-4">
                    <div className="w-full max-w-md bg-white rounded-[2rem] shadow-2xl p-8">
                        <div className="text-center mb-6">
                            <div className="text-6xl mb-3">🙋‍♂️</div>
                            <h1 className="text-3xl font-black text-indigo-700 uppercase tracking-tight">AI Pose Quiz</h1>
                            <p className="text-slate-500 font-semibold mt-1">Đăng nhập để đồng bộ bài dạy và câu hỏi</p>
                        </div>
                        <div className="grid grid-cols-2 gap-2 bg-slate-100 p-1 rounded-xl mb-5">
                            <button type="button" onClick={() => { setMode('login'); setMessage(''); }} className={`py-2 rounded-lg font-black text-sm ${mode === 'login' ? 'bg-white text-indigo-700 shadow' : 'text-slate-500'}`}>ĐĂNG NHẬP</button>
                            <button type="button" onClick={() => { setMode('register'); setMessage(''); }} className={`py-2 rounded-lg font-black text-sm ${mode === 'register' ? 'bg-white text-indigo-700 shadow' : 'text-slate-500'}`}>ĐĂNG KÝ</button>
                        </div>
                        <form onSubmit={submit} className="space-y-4">
                            <div>
                                <label className="text-xs font-black text-slate-500 uppercase">Email</label>
                                <input type="email" required value={email} onChange={(e) => setEmail(e.target.value)} className="mt-1 w-full px-4 py-3 rounded-xl border-2 border-slate-200 outline-none focus:border-indigo-400 font-semibold" placeholder="giaovien@truong.edu.vn" />
                            </div>
                            <div>
                                <label className="text-xs font-black text-slate-500 uppercase">Mật khẩu</label>
                                <input type="password" required minLength="6" value={password} onChange={(e) => setPassword(e.target.value)} className="mt-1 w-full px-4 py-3 rounded-xl border-2 border-slate-200 outline-none focus:border-indigo-400 font-semibold" placeholder="Tối thiểu 6 ký tự" />
                            </div>
                            {message && <div className="text-sm font-bold text-center text-amber-700 bg-amber-50 border border-amber-200 rounded-xl p-3">{message}</div>}
                            <button disabled={busy} className="w-full bg-indigo-600 hover:bg-indigo-500 disabled:opacity-60 text-white py-3.5 rounded-xl font-black text-lg shadow-lg">
                                {busy ? 'ĐANG XỬ LÝ...' : mode === 'login' ? 'ĐĂNG NHẬP' : 'TẠO TÀI KHOẢN'}
                            </button>
                        </form>
                        <p className="text-[11px] text-slate-400 text-center mt-5">Mỗi tài khoản chỉ xem và sửa các bài dạy của chính mình.</p>
                    </div>
                </div>
            );
        };

        const CloudLibrary = ({ setScreen, setSettings, setCloudId, onNewLesson }) => {
            const [items, setItems] = useState([]);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState('');

            const load = async () => {
                setLoading(true);
                setError('');
                try {
                    const result = await backendRequest('lessons.list');
                    setItems(result.items || []);
                } catch (err) {
                    setError(err.message || 'Không tải được thư viện.');
                } finally {
                    setLoading(false);
                }
            };

            useEffect(() => { load(); }, []);

            const openItem = async (item) => {
                try {
                    const result = await backendRequest('lessons.get', { id: item.id });
                    setSettings(result.item.data);
                    setCloudId(result.item.id);
                    setScreen('EDITOR');
                } catch (err) {
                    alert('Không mở được bài dạy: ' + err.message);
                }
            };

            const removeItem = async (id) => {
                if (!confirm('Xóa bài dạy này khỏi đám mây?')) return;
                try {
                    await backendRequest('lessons.delete', { id });
                    load();
                } catch (err) {
                    alert('Không xóa được bài dạy: ' + err.message);
                }
            };

            return (
                <div className="w-full h-full bg-slate-50 flex flex-col">
                    <div className="bg-indigo-700 text-white p-5 px-8 flex items-center justify-between shadow-lg">
                        <div>
                            <h2 className="text-3xl font-black uppercase">☁️ Bài dạy cloud</h2>
                            <p className="text-indigo-200 text-sm font-semibold">Dữ liệu và media được xử lý qua backend</p>
                        </div>
                        <div className="flex gap-2">
                            <button onClick={onNewLesson} className="bg-emerald-500 hover:bg-emerald-400 px-5 py-2 rounded-xl font-black">+ BÀI MỚI</button>
                            <button onClick={() => setScreen('MENU')} className="bg-white/15 hover:bg-white/25 px-5 py-2 rounded-xl font-black">← TRANG CHỦ</button>
                        </div>
                    </div>
                    <div className="flex-1 overflow-y-auto p-6">
                        <div className="max-w-5xl mx-auto">
                            {loading && <div className="text-center text-slate-500 font-bold py-16">Đang tải thư viện từ backend...</div>}
                            {error && <div className="bg-red-50 border border-red-200 text-red-700 rounded-2xl p-5 font-bold">Không tải được dữ liệu: {error}</div>}
                            {!loading && !error && items.length === 0 && <div className="text-center bg-white rounded-3xl border-2 border-dashed border-slate-200 p-16 text-slate-500"><div className="text-6xl mb-4">☁️</div><div className="text-xl font-black">Chưa có bài dạy nào trên cloud</div><div className="mt-2">Bấm “Bài mới” hoặc vào “Soạn bài”.</div></div>}
                            <div className="grid md:grid-cols-2 gap-4">
                                {items.map(item => (
                                    <div key={item.id} className="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 flex flex-col gap-4">
                                        <div className="flex-1">
                                            <div className="text-[10px] font-black text-indigo-500 uppercase mb-1">{item.subject_name || 'Chưa phân loại'}</div>
                                            <h3 className="text-xl font-black text-slate-800">{item.title || 'Bài dạy chưa đặt tên'}</h3>
                                            <p className="text-xs text-slate-400 font-bold mt-1">Cập nhật: {new Date(item.updated_at).toLocaleString('vi-VN')}</p>
                                            <p className="text-sm text-slate-500 font-semibold mt-2">{item.question_count || 0} câu hỏi</p>
                                        </div>
                                        <div className="flex gap-2">
                                            <button onClick={() => openItem(item)} className="flex-1 bg-indigo-600 text-white py-2.5 rounded-xl font-black">MỞ</button>
                                            <button onClick={() => removeItem(item.id)} className="bg-red-50 text-red-600 border border-red-100 px-4 rounded-xl font-black">XÓA</button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const GroupManager = ({ setScreen, user }) => {
            const [groups, setGroups] = useState([]);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState('');
            const [newGroupName, setNewGroupName] = useState('');
            const [joinCode, setJoinCode] = useState('');
            const [busy, setBusy] = useState(false);

            const loadGroups = async () => {
                setLoading(true);
                setError('');
                try {
                    const result = await backendRequest('groups.list');
                    setGroups(result.groups || []);
                } catch (err) {
                    setError(err.message || 'Không tải được nhóm.');
                } finally {
                    setLoading(false);
                }
            };

            useEffect(() => { loadGroups(); }, []);

            const createGroup = async () => {
                const name = newGroupName.trim();
                if (!name) return alert('Hãy nhập tên nhóm.');
                setBusy(true);
                try {
                    await backendRequest('groups.create', { name });
                    setNewGroupName('');
                    await loadGroups();
                } catch (err) {
                    alert('Không tạo được nhóm: ' + err.message);
                } finally {
                    setBusy(false);
                }
            };

            const joinGroup = async () => {
                const code = joinCode.trim().toUpperCase();
                if (!code) return alert('Hãy nhập mã nhóm.');
                setBusy(true);
                try {
                    await backendRequest('groups.join', { code });
                    setJoinCode('');
                    await loadGroups();
                } catch (err) {
                    alert('Không tham gia được nhóm: ' + err.message);
                } finally {
                    setBusy(false);
                }
            };

            const leaveOrDelete = async (group) => {
                const isOwner = group.is_owner || group.owner_id === user.id;
                if (!confirm(isOwner ? 'Xóa nhóm này? Câu đã chia sẻ sẽ chuyển về Riêng tư.' : 'Rời khỏi nhóm này?')) return;
                try {
                    await backendRequest(isOwner ? 'groups.delete' : 'groups.leave', { group_id: group.id });
                    await loadGroups();
                } catch (err) {
                    alert(err.message);
                }
            };

            const copyCode = async (code) => {
                try {
                    await navigator.clipboard.writeText(code);
                    alert('Đã sao chép mã nhóm: ' + code);
                } catch {
                    prompt('Sao chép mã nhóm:', code);
                }
            };

            return (
                <div className="w-full h-full bg-slate-50 flex flex-col text-slate-800">
                    <div className="bg-fuchsia-700 text-white px-8 py-5 flex items-center justify-between shadow-lg">
                        <div>
                            <h2 className="text-3xl font-black uppercase">👥 Nhóm chia sẻ</h2>
                            <p className="text-fuchsia-200 text-sm font-semibold">Tạo nhóm riêng hoặc tham gia bằng mã nhóm</p>
                        </div>
                        <button onClick={() => setScreen('MENU')} className="bg-white/15 hover:bg-white/25 px-5 py-2 rounded-xl font-black">← TRANG CHỦ</button>
                    </div>

                    <div className="p-6 overflow-y-auto flex-1">
                        <div className="max-w-5xl mx-auto space-y-6">
                            <div className="grid md:grid-cols-2 gap-5">
                                <div className="bg-white rounded-3xl border border-slate-200 p-6 shadow-sm">
                                    <h3 className="text-lg font-black text-fuchsia-700 mb-3">Tạo nhóm mới</h3>
                                    <p className="text-sm text-slate-500 font-semibold mb-4">Hệ thống sinh mã nhóm 8 ký tự ở backend.</p>
                                    <div className="flex gap-2">
                                        <input value={newGroupName} onChange={(e) => setNewGroupName(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && createGroup()} placeholder="Tên nhóm..." className="flex-1 px-4 py-3 rounded-xl border-2 border-slate-200 outline-none focus:border-fuchsia-400 font-bold" />
                                        <button disabled={busy} onClick={createGroup} className="px-5 rounded-xl bg-fuchsia-600 text-white font-black disabled:opacity-50">TẠO</button>
                                    </div>
                                </div>

                                <div className="bg-white rounded-3xl border border-slate-200 p-6 shadow-sm">
                                    <h3 className="text-lg font-black text-indigo-700 mb-3">Tham gia bằng mã</h3>
                                    <p className="text-sm text-slate-500 font-semibold mb-4">Nhập mã 8 ký tự do chủ nhóm gửi.</p>
                                    <div className="flex gap-2">
                                        <input value={joinCode} onChange={(e) => setJoinCode(e.target.value.toUpperCase())} onKeyDown={(e) => e.key === 'Enter' && joinGroup()} maxLength="8" placeholder="VD: A1B2C3D4" className="flex-1 px-4 py-3 rounded-xl border-2 border-slate-200 outline-none focus:border-indigo-400 font-black uppercase tracking-widest" />
                                        <button disabled={busy} onClick={joinGroup} className="px-5 rounded-xl bg-indigo-600 text-white font-black disabled:opacity-50">THAM GIA</button>
                                    </div>
                                </div>
                            </div>

                            <div>
                                <div className="flex items-center justify-between mb-3">
                                    <h3 className="text-xl font-black">Nhóm của tôi</h3>
                                    <span className="text-sm font-bold text-slate-400">{groups.length} nhóm</span>
                                </div>
                                {loading && <div className="text-center py-12 text-slate-500 font-bold">Đang tải nhóm...</div>}
                                {error && <div className="bg-red-50 border border-red-200 text-red-700 rounded-2xl p-5 font-bold">Không tải được nhóm: {error}</div>}
                                {!loading && !error && groups.length === 0 && (
                                    <div className="bg-white border-2 border-dashed border-slate-200 rounded-3xl p-12 text-center text-slate-500">
                                        <div className="text-5xl mb-3">👥</div>
                                        <div className="font-black text-lg">Chưa tham gia nhóm nào</div>
                                    </div>
                                )}
                                <div className="grid md:grid-cols-2 gap-4">
                                    {groups.map(group => {
                                        const isOwner = group.is_owner || group.owner_id === user.id;
                                        return (
                                            <div key={group.id} className="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm">
                                                <div className="flex items-start justify-between gap-3">
                                                    <div>
                                                        <div className="flex gap-2 items-center mb-1">
                                                            <h4 className="text-lg font-black text-slate-800">{group.name}</h4>
                                                            <span className={`text-[9px] font-black px-2 py-1 rounded-lg ${isOwner ? 'bg-fuchsia-50 text-fuchsia-700' : 'bg-indigo-50 text-indigo-700'}`}>{isOwner ? 'CHỦ NHÓM' : 'THÀNH VIÊN'}</span>
                                                        </div>
                                                        <div className="text-xs text-slate-400 font-bold">Mã nhóm</div>
                                                        <div className="text-2xl font-black tracking-[0.18em] text-indigo-700 mt-1">{group.join_code}</div>
                                                        <div className="text-xs font-bold text-slate-400 mt-2">{group.member_count || 1} thành viên</div>
                                                    </div>
                                                    <button onClick={() => copyCode(group.join_code)} className="bg-slate-100 hover:bg-slate-200 px-3 py-2 rounded-xl text-xs font-black">SAO CHÉP</button>
                                                </div>
                                                <button onClick={() => leaveOrDelete(group)} className="mt-5 w-full py-2.5 rounded-xl border border-red-100 bg-red-50 text-red-600 font-black text-xs uppercase">{isOwner ? 'Xóa nhóm' : 'Rời nhóm'}</button>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const QuestionBank = ({ setScreen, settings, setSettings, user }) => {
            const [items, setItems] = useState([]);
            const [groups, setGroups] = useState([]);
            const [subjects, setSubjects] = useState([]);
            const [lessons, setLessons] = useState([]);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState('');
            const [subjectFilter, setSubjectFilter] = useState('ALL');
            const [lessonFilter, setLessonFilter] = useState('ALL');
            const [shareFilter, setShareFilter] = useState('ALL');
            const [searchText, setSearchText] = useState('');
            const [selected, setSelected] = useState(() => new Set());

            const load = async () => {
                setLoading(true);
                setError('');
                try {
                    const [bankResult, groupResult] = await Promise.all([
                        backendRequest('bank.list', {
                            subject_name: subjectFilter,
                            lesson_name: lessonFilter,
                            source: shareFilter,
                            search: searchText
                        }),
                        backendRequest('groups.list')
                    ]);
                    setItems(bankResult.items || []);
                    setSubjects(bankResult.facets?.subjects || []);
                    setLessons(bankResult.facets?.lessons || []);
                    setGroups(groupResult.groups || []);
                } catch (err) {
                    setError(err.message || 'Không tải được kho câu hỏi.');
                } finally {
                    setLoading(false);
                }
            };

            useEffect(() => {
                const timer = setTimeout(() => load(), 180);
                return () => clearTimeout(timer);
            }, [subjectFilter, lessonFilter, shareFilter, searchText]);

            const groupNames = useMemo(
                () => Object.fromEntries(groups.map(group => [group.id, group.name])),
                [groups]
            );

            useEffect(() => {
                if (lessonFilter !== 'ALL' && lessons.length && !lessons.includes(lessonFilter)) {
                    setLessonFilter('ALL');
                }
            }, [lessons, lessonFilter]);

            const visibleItems = items;

            const toggle = (id) => {
                setSelected(prev => {
                    const next = new Set(prev);
                    if (next.has(id)) next.delete(id);
                    else next.add(id);
                    return next;
                });
            };

            const toggleAllVisible = () => {
                const ids = visibleItems.map(item => item.id);
                const allSelected = ids.length > 0 && ids.every(id => selected.has(id));
                setSelected(prev => {
                    const next = new Set(prev);
                    ids.forEach(id => allSelected ? next.delete(id) : next.add(id));
                    return next;
                });
            };

            const addSelectedToLesson = async () => {
                const ids = [...selected];
                if (!ids.length) return alert('Hãy chọn ít nhất một câu hỏi.');
                try {
                    const result = await backendRequest('bank.resolve', { ids });
                    const imported = result.questions || [];
                    setSettings({ ...settings, questions: [...settings.questions, ...imported] });
                    alert(`Đã thêm ${imported.length} câu hỏi do backend xác thực vào bài đang soạn.`);
                    setScreen('EDITOR');
                } catch (err) {
                    alert('Không lấy được câu hỏi: ' + err.message);
                }
            };

            const ownSelectedIds = items
                .filter(item => selected.has(item.id) && item.user_id === user.id)
                .map(item => item.id);

            const deleteSelected = async () => {
                if (!ownSelectedIds.length) return alert('Không có câu hỏi do thầy/cô sở hữu trong phần đã chọn.');
                if (!confirm(`Xóa ${ownSelectedIds.length} câu của thầy/cô khỏi kho?`)) return;
                try {
                    await backendRequest('bank.delete', { ids: ownSelectedIds });
                    setSelected(prev => {
                        const next = new Set(prev);
                        ownSelectedIds.forEach(id => next.delete(id));
                        return next;
                    });
                    load();
                } catch (err) {
                    alert('Không xóa được câu hỏi: ' + err.message);
                }
            };

            const visibilityInfo = (item) => {
                if (item.visibility === 'public') return { label: '🌐 Công khai', cls: 'bg-emerald-50 text-emerald-700' };
                if (item.visibility === 'group') return { label: '👥 ' + (groupNames[item.group_id] || 'Nhóm riêng'), cls: 'bg-fuchsia-50 text-fuchsia-700' };
                return { label: '🔒 Riêng tư', cls: 'bg-slate-100 text-slate-600' };
            };

            return (
                <div className="w-full h-full bg-slate-50 flex flex-col text-slate-800 relative">
                    <div className="bg-violet-700 text-white px-8 py-5 flex items-center justify-between shadow-lg">
                        <div>
                            <h2 className="text-3xl font-black uppercase">📚 Kho câu hỏi</h2>
                            <p className="text-violet-200 text-sm font-semibold">Môn học → Bài học → Câu hỏi • Riêng tư / Công khai / Theo nhóm</p>
                        </div>
                        <div className="flex gap-2">
                            <button onClick={() => setScreen('EDITOR')} className="bg-white/15 hover:bg-white/25 px-4 py-2 rounded-xl font-black">← SOẠN BÀI</button>
                            <button onClick={() => setScreen('MENU')} className="bg-white/15 hover:bg-white/25 px-4 py-2 rounded-xl font-black">TRANG CHỦ</button>
                        </div>
                    </div>

                    <div className="bg-white border-b border-slate-200 px-6 py-4">
                        <div className="max-w-7xl mx-auto flex flex-wrap gap-3 items-center">
                            <div className="text-sm font-black text-slate-600 mr-auto">
                                Bài đang soạn: <span className="text-violet-700">{settings.subject || 'Chưa chọn môn'} / {settings.title || 'Chưa đặt tên bài'}</span>
                            </div>
                            <select value={subjectFilter} onChange={(e) => setSubjectFilter(e.target.value)} className="px-3 py-2 rounded-xl border border-slate-200 bg-slate-50 font-bold text-sm">
                                <option value="ALL">Tất cả môn</option>
                                {subjects.map(subject => <option key={subject} value={subject}>{subject}</option>)}
                            </select>
                            <select value={lessonFilter} onChange={(e) => setLessonFilter(e.target.value)} className="px-3 py-2 rounded-xl border border-slate-200 bg-slate-50 font-bold text-sm">
                                <option value="ALL">Tất cả bài</option>
                                {lessons.map(lesson => <option key={lesson} value={lesson}>{lesson}</option>)}
                            </select>
                            <select value={shareFilter} onChange={(e) => setShareFilter(e.target.value)} className="px-3 py-2 rounded-xl border border-slate-200 bg-slate-50 font-bold text-sm">
                                <option value="ALL">Tất cả nguồn</option>
                                <option value="MINE">Câu của tôi</option>
                                <option value="PUBLIC">Công khai</option>
                                <option value="GROUP">Nhóm chia sẻ</option>
                            </select>
                            <input value={searchText} onChange={(e) => setSearchText(e.target.value)} placeholder="Tìm nội dung..." className="w-56 max-w-full px-3 py-2 rounded-xl border border-slate-200 outline-none focus:border-violet-400 font-semibold text-sm" />
                            <button onClick={toggleAllVisible} className="px-4 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 font-black text-sm">Chọn tất cả</button>
                        </div>
                    </div>

                    <div className="flex-1 overflow-y-auto p-6">
                        <div className="max-w-7xl mx-auto">
                            {loading && <div className="text-center py-16 font-bold text-slate-500">Đang tải kho câu hỏi...</div>}
                            {error && <div className="bg-red-50 border border-red-200 text-red-700 rounded-2xl p-5 font-bold">Không tải được kho câu hỏi: {error}<div className="text-xs mt-2">Backend chưa sẵn sàng. Hãy kiểm tra kết nối.</div></div>}
                            {!loading && !error && visibleItems.length === 0 && (
                                <div className="text-center bg-white rounded-3xl border-2 border-dashed border-slate-200 p-14 text-slate-500">
                                    <div className="text-6xl mb-3">📭</div>
                                    <div className="text-xl font-black">Chưa có câu hỏi phù hợp</div>
                                    <p className="mt-2">Có thể thay đổi bộ lọc hoặc lưu câu hỏi mới từ màn hình soạn bài.</p>
                                </div>
                            )}

                            <div className="space-y-3 pb-24">
                                {visibleItems.map((item, idx) => {
                                    const isSelected = selected.has(item.id);
                                    const correct = item.question?.answers?.find(ans => ans.isCorrect);
                                    const visibility = visibilityInfo(item);
                                    const isMine = item.user_id === user.id;
                                    return (
                                        <button key={item.id} onClick={() => toggle(item.id)} className={`w-full text-left bg-white border-2 rounded-2xl p-4 shadow-sm transition-all ${isSelected ? 'border-violet-500 ring-4 ring-violet-100' : 'border-slate-100 hover:border-violet-200'}`}>
                                            <div className="flex gap-4 items-start">
                                                <div className={`w-7 h-7 rounded-lg border-2 flex items-center justify-center flex-shrink-0 font-black ${isSelected ? 'bg-violet-600 border-violet-600 text-white' : 'border-slate-300 text-transparent'}`}>✓</div>
                                                <div className="flex-1 min-w-0">
                                                    <div className="flex flex-wrap gap-2 items-center mb-2">
                                                        <span className="bg-indigo-50 text-indigo-700 px-2 py-1 rounded-lg text-[10px] font-black uppercase">{item.subject_name || 'Chưa phân loại'}</span>
                                                        <span className="bg-violet-50 text-violet-700 px-2 py-1 rounded-lg text-[10px] font-black uppercase">{item.lesson_name}</span>
                                                        <span className={`px-2 py-1 rounded-lg text-[10px] font-black uppercase ${visibility.cls}`}>{visibility.label}</span>
                                                        <span className={`px-2 py-1 rounded-lg text-[10px] font-black uppercase ${isMine ? 'bg-blue-50 text-blue-700' : 'bg-amber-50 text-amber-700'}`}>{isMine ? 'Câu của tôi' : 'Được chia sẻ'}</span>
                                                        {item.question?.image && <span className="bg-cyan-50 text-cyan-700 px-2 py-1 rounded-lg text-[10px] font-black">🖼️ ẢNH</span>}
                                                        {item.question?.audio?.data && <span className="bg-amber-50 text-amber-700 px-2 py-1 rounded-lg text-[10px] font-black">🔊 ÂM THANH</span>}
                                                        <span className="text-[10px] text-slate-400 font-bold">#{idx + 1}</span>
                                                    </div>
                                                    <div className="text-base font-black text-slate-800">{item.question?.text || 'Câu hỏi không có nội dung'}</div>
                                                    {correct && <div className="mt-2 text-xs font-bold text-emerald-600">Đáp án đúng: {correct.text}</div>}
                                                </div>
                                                {item.question?.image && <img src={mediaSrc(item.question.image)} className="w-20 h-20 object-contain rounded-xl border border-slate-100 bg-slate-50" />}
                                            </div>
                                        </button>
                                    );
                                })}
                            </div>
                        </div>
                    </div>

                    <div className="absolute bottom-0 left-0 right-0 bg-white/95 backdrop-blur border-t border-slate-200 px-6 py-4 shadow-2xl">
                        <div className="max-w-7xl mx-auto flex items-center justify-between gap-4">
                            <div className="font-black text-slate-600">Đã chọn: <span className="text-violet-700 text-xl">{selected.size}</span> câu</div>
                            <div className="flex gap-3">
                                <button onClick={deleteSelected} disabled={!ownSelectedIds.length} className="px-5 py-3 rounded-xl bg-red-50 text-red-600 border border-red-100 font-black disabled:opacity-40">Xóa câu của tôi ({ownSelectedIds.length})</button>
                                <button onClick={addSelectedToLesson} disabled={!selected.size} className="px-7 py-3 rounded-xl bg-violet-600 text-white font-black shadow-lg disabled:opacity-40">+ Thêm {selected.size || ''} câu vào bài đang soạn</button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [screen, setScreen] = useState('MENU');
            const [score, setScore] = useState(0);
            const [session, setSession] = useState(null);
            const [authReady, setAuthReady] = useState(false);
            const [backendReady, setBackendReady] = useState(false);
            const [backendError, setBackendError] = useState('');
            const [cloudId, setCloudId] = useState(null);
            
            const [settings, setSettings] = useState(() => {
                return {
                    subject: "Tin học",
                    title: "Bài dạy AI Pose Quiz",
                    bankVisibility: "private",
                    bankGroupId: "",
                    timeLimit: 20,
                    checkInterval: 3,
                    numAnswers: 4,
                    poseAssets: {
                        NONE: null,
                        RAISE_LEFT: null,
                        RAISE_RIGHT: null,
                        BOTH_UP: null,
                        CROSS_ARMS: null
                    },
                    questions: [
                        {
                            id: Date.now(),
                            text: "Em hãy tạo dáng 'Giơ tay trái' giống bạn nhỏ nhé!",
                            image: null,
                            audio: { data: null, name: "" },
                            answers: [
                                { text: "Giơ tay trái thật cao lên nhé", pose: "RAISE_LEFT", isCorrect: true, image: null },
                                { text: "Giơ tay phải giống như chào", pose: "RAISE_RIGHT", isCorrect: false, image: null },
                                { text: "Cả hai tay giơ lên trời", pose: "BOTH_UP", isCorrect: false, image: null },
                                { text: "Khoanh tay trước ngực", pose: "CROSS_ARMS", isCorrect: false, image: null }
                            ]
                        }
                    ],
                    audio: {
                        correct: { data: null, name: "" },
                        wrong: { data: null, name: "" },
                        bgm: { data: null, name: "" },
                        bgmVolume: 0.3,
                        feedbackVolume: 0.9,
                        questionVolume: 1,
                        defaultFeedback: true
                    },
                    theme: {
                        background: null,
                        overlay: 0.68,
                        fit: "cover"
                    }
                };
            });

            useEffect(() => {
                let active = true;
                supabaseClient.auth.getSession().then(({ data }) => {
                    if (!active) return;
                    setSession(data.session || null);
                    setAuthReady(true);
                });
                const { data: listener } = supabaseClient.auth.onAuthStateChange((_event, nextSession) => {
                    if (!active) return;
                    setSession(nextSession || null);
                    setAuthReady(true);
                });
                return () => {
                    active = false;
                    listener?.subscription?.unsubscribe();
                };
            }, []);

            useEffect(() => {
                if (!session) {
                    setBackendReady(false);
                    setBackendError('');
                    return;
                }
                let cancelled = false;
                setBackendReady(false);
                setBackendError('');
                backendRequest('bootstrap')
                    .then(() => { if (!cancelled) setBackendReady(true); })
                    .catch((err) => { if (!cancelled) setBackendError(err.message || 'Không kết nối được backend.'); });
                return () => { cancelled = true; };
            }, [session?.access_token]);

            const storageUsage = useMemo(() => {
                const paths = new Set();
                const walk = (value) => {
                    if (Array.isArray(value)) return value.forEach(walk);
                    if (!value || typeof value !== 'object') return;
                    if (value.path) paths.add(value.path);
                    Object.values(value).forEach(walk);
                };
                walk(settings);
                return paths.size;
            }, [settings]);

            const saveQuestionsToBank = async (questions) => {
                const subjectName = (settings.subject || 'Chưa phân loại').trim() || 'Chưa phân loại';
                const lessonName = (settings.title || 'Chưa phân loại').trim() || 'Chưa phân loại';
                const visibility = ['private', 'public', 'group'].includes(settings.bankVisibility)
                    ? settings.bankVisibility
                    : 'private';
                const groupId = visibility === 'group' ? (settings.bankGroupId || null) : null;

                if (!questions?.length) return alert('Không có câu hỏi để lưu.');
                if (visibility === 'group' && !groupId) return alert('Hãy chọn nhóm muốn chia sẻ.');

                try {
                    const result = await backendRequest('bank.save', {
                        subject_name: subjectName,
                        lesson_name: lessonName,
                        visibility,
                        group_id: groupId,
                        questions,
                        pose_assets: settings.poseAssets || {}
                    });
                    alert(`Đã lưu ${result.count || questions.length} câu vào kho qua backend.`);
                } catch (err) {
                    alert('Không lưu được vào kho câu hỏi: ' + err.message);
                }
            };

            const saveToCloud = async () => {
                try {
                    const result = await backendRequest('lessons.save', {
                        id: cloudId,
                        subject_name: (settings.subject || 'Chưa phân loại').trim(),
                        title: (settings.title || 'Bài dạy AI Pose Quiz').trim(),
                        data: settings
                    });
                    setCloudId(result.item.id);
                    setSettings(result.item.data);
                    alert(cloudId ? 'Đã cập nhật bài dạy trên backend.' : 'Đã lưu bài dạy và toàn bộ media lên backend.');
                } catch (err) {
                    alert('Không lưu được bài dạy: ' + err.message);
                }
            };

            const newLesson = () => {
                setCloudId(null);
                setSettings({
                    subject: 'Tin học',
                    title: 'Bài dạy mới',
                    bankVisibility: 'private',
                    bankGroupId: '',
                    timeLimit: 20,
                    checkInterval: 3,
                    numAnswers: 4,
                    poseAssets: { NONE: null, RAISE_LEFT: null, RAISE_RIGHT: null, BOTH_UP: null, CROSS_ARMS: null },
                    questions: [{
                        id: Date.now(),
                        text: 'Nhập nội dung câu hỏi...',
                        image: null,
                        audio: { data: null, name: '' },
                        answers: Array(4).fill(0).map((_, idx) => ({ text: `Đáp án ${idx + 1}`, pose: 'NONE', isCorrect: idx === 0, image: null }))
                    }],
                    audio: {
                        correct: { data: null, name: '' },
                        wrong: { data: null, name: '' },
                        bgm: { data: null, name: '' },
                        bgmVolume: 0.3,
                        feedbackVolume: 0.9,
                        questionVolume: 1,
                        defaultFeedback: true
                    },
                    theme: {
                        background: null,
                        overlay: 0.68,
                        fit: 'cover'
                    }
                });
                setScreen('EDITOR');
            };

            if (!authReady) {
                return <div className="w-screen h-screen grid place-items-center bg-slate-950 text-white font-black text-xl">Đang kết nối Supabase...</div>;
            }

            if (!session) return <AuthScreen />;

            if (!backendReady) {
                return (
                    <div className="w-screen h-screen bg-slate-950 text-white grid place-items-center p-6 text-center">
                        <div>
                            <div className="text-6xl mb-4">⚙️</div>
                            <div className="text-xl font-black">{backendError ? 'Không kết nối được backend' : 'Đang khởi tạo backend...'}</div>
                            {backendError && <div className="mt-3 text-red-300 font-bold max-w-xl">{backendError}</div>}
                            {backendError && <button onClick={() => window.location.reload()} className="mt-5 bg-indigo-600 px-5 py-2 rounded-xl font-black">THỬ LẠI</button>}
                        </div>
                    </div>
                );
            }

            return (
                <div className="w-screen h-screen bg-white overflow-hidden select-none">
                    {screen === 'MENU' && <MainMenu setScreen={setScreen} user={session.user} onSignOut={() => supabaseClient.auth.signOut()} />}
                    {screen === 'GAME' && <Game settings={settings} setScreen={setScreen} setScore={setScore} />}
                    {screen === 'EDITOR' && <Editor settings={settings} setSettings={setSettings} setScreen={setScreen} usage={storageUsage} onSaveCloud={saveToCloud} onOpenCloud={() => setScreen('CLOUD')} onOpenBank={() => setScreen('BANK')} onSaveQuestionsToBank={saveQuestionsToBank} onImported={() => setCloudId(null)} cloudId={cloudId} />}
                    {screen === 'CLOUD' && <CloudLibrary setScreen={setScreen} setSettings={setSettings} setCloudId={setCloudId} onNewLesson={newLesson} />}
                    {screen === 'BANK' && <QuestionBank setScreen={setScreen} settings={settings} setSettings={setSettings} user={session.user} />}
                    {screen === 'GROUPS' && <GroupManager setScreen={setScreen} user={session.user} />}
                    {screen === 'RESULT' && <Result score={score} total={settings.questions.length} setScreen={setScreen} />}
                </div>
            );
        };

        const MainMenu = ({ setScreen, user, onSignOut }) => (
            <div className="w-full h-full flex flex-col items-center justify-center bg-gradient-to-br from-indigo-600 to-purple-700 text-white p-4 text-center relative">
                <div className="absolute top-5 right-6 flex items-center gap-3 bg-white/10 border border-white/20 rounded-2xl px-4 py-2 backdrop-blur">
                    <span className="text-xs font-bold max-w-56 truncate">{user?.email}</span>
                    <button onClick={onSignOut} className="text-xs font-black bg-white/15 hover:bg-white/25 px-3 py-1.5 rounded-lg">ĐĂNG XUẤT</button>
                </div>
                <div className="mb-4 text-8xl animate-bounce drop-shadow-2xl">🙋‍♂️</div>
                <h1 className="text-6xl font-black mb-2 tracking-tighter uppercase">AI POSE QUIZ</h1>
                <p className="text-white/80 text-xl mb-7 italic">Học vui cùng trí tuệ nhân tạo - V9.9 Cloud</p>
                <div className="flex flex-col gap-3 w-[34rem] max-w-full">
                    <button onClick={() => { unlockAudio(); setScreen('GAME'); }} className="bg-green-500 hover:bg-green-400 py-4 rounded-2xl text-2xl font-black shadow-xl transition-all active:scale-95 uppercase">Bắt đầu</button>
                    <div className="grid grid-cols-2 gap-3">
                        <button onClick={() => setScreen('EDITOR')} className="bg-white/10 hover:bg-white/20 py-3.5 rounded-2xl text-base font-black backdrop-blur-md border border-white/30 transition-all uppercase">✏️ Soạn bài</button>
                        <button onClick={() => setScreen('BANK')} className="bg-violet-500/90 hover:bg-violet-400 py-3.5 rounded-2xl text-base font-black shadow-lg transition-all uppercase">📚 Kho câu hỏi</button>
                        <button onClick={() => setScreen('GROUPS')} className="bg-fuchsia-500/90 hover:bg-fuchsia-400 py-3.5 rounded-2xl text-base font-black shadow-lg transition-all uppercase">👥 Nhóm chia sẻ</button>
                        <button onClick={() => setScreen('CLOUD')} className="bg-sky-500/90 hover:bg-sky-400 py-3.5 rounded-2xl text-base font-black shadow-lg transition-all uppercase">☁️ Bài dạy cloud</button>
                    </div>
                </div>
            </div>
        );

        const Game = ({ settings, setScreen, setScore }) => {
            const [qIndex, setQIndex] = useState(0);
            const [timeLeft, setTimeLeft] = useState(settings.timeLimit);
            const [checkTimer, setCheckTimer] = useState(settings.checkInterval || 3);
            const [detectedPose, setDetectedPose] = useState('NONE');
            const [feedback, setFeedback] = useState(null);
            const [correctCount, setCorrectCount] = useState(0);
            const [isMuted, setIsMuted] = useState(false);
            const [gameToken, setGameToken] = useState(null);
            const [gameReady, setGameReady] = useState(false);
            const [gameError, setGameError] = useState('');
            const checkInFlightRef = useRef(false);
            
            const videoRef = useRef(null);
            const canvasRef = useRef(null);
            const poseRef = useRef(null);
            const cameraRef = useRef(null);
            const bgmRef = useRef(null);
            const questionAudioRef = useRef(null);
            const isMounted = useRef(true);

            const currentQuestion = settings.questions[qIndex];
            const lessonBackground = mediaSrc(settings.theme?.background);
            const lessonOverlay = Math.min(0.95, Math.max(0.2, Number(settings.theme?.overlay ?? 0.68)));
            const lessonBackgroundFit = settings.theme?.fit === 'contain' ? 'contain' : 'cover';

            const getPoseVisual = (poseId) => {
                if (mediaSrc(settings.poseAssets?.[poseId])) {
                    return <img src={mediaSrc(settings.poseAssets[poseId])} className="w-full h-full object-contain" />;
                }
                return <span className="text-4xl">{DEFAULT_POSE_CONFIG[poseId]?.icon || '❓'}</span>;
            };

            useEffect(() => {
                let cancelled = false;
                setGameReady(false);
                setGameError('');
                backendRequest('game.start', { data: settings })
                    .then((result) => {
                        if (cancelled) return;
                        setGameToken(result.game_token);
                        setQIndex(result.index || 0);
                        setCorrectCount(result.score || 0);
                        setGameReady(true);
                    })
                    .catch((err) => {
                        if (!cancelled) setGameError(err.message || 'Không tạo được phiên chơi.');
                    });
                return () => { cancelled = true; };
            }, []);

            const checkAnswer = useCallback(async () => {
                if (feedback || !gameReady || !gameToken || checkInFlightRef.current) return;
                checkInFlightRef.current = true;
                try {
                    const result = await backendRequest('game.check', {
                        game_token: gameToken,
                        detected_pose: detectedPose
                    });

                    const isCorrect = result.feedback === 'correct';
                    setFeedback(result.feedback);
                    setCorrectCount(result.score || 0);

                    if (questionAudioRef.current) {
                        questionAudioRef.current.pause();
                        questionAudioRef.current.currentTime = 0;
                    }
                    const audioSrc = mediaSrc(isCorrect ? settings.audio.correct?.data : settings.audio.wrong?.data);
                    if (!isMuted && audioSrc) {
                        const feedbackAudio = new Audio(audioSrc);
                        feedbackAudio.volume = Math.min(1, Math.max(0, Number(settings.audio.feedbackVolume ?? 0.9)));
                        feedbackAudio.play().catch(() => {
                            if (settings.audio.defaultFeedback !== false) playDefaultFeedbackTone(isCorrect, settings.audio.feedbackVolume ?? 0.9);
                        });
                    } else if (!isMuted && settings.audio.defaultFeedback !== false) {
                        playDefaultFeedbackTone(isCorrect, settings.audio.feedbackVolume ?? 0.9);
                    }

                    setTimeout(() => {
                        if (!isMounted.current) return;
                        if (result.finished) {
                            setScore(result.score || 0);
                            setScreen('RESULT');
                        } else {
                            setGameToken(result.game_token);
                            setQIndex(result.next_index);
                            setTimeLeft(settings.timeLimit);
                            setCheckTimer(settings.checkInterval || 3);
                            setFeedback(null);
                            checkInFlightRef.current = false;
                        }
                    }, 1500);
                } catch (err) {
                    checkInFlightRef.current = false;
                    alert('Backend không chấm được câu hỏi: ' + err.message);
                }
            }, [feedback, gameReady, gameToken, detectedPose, isMuted, settings, setScore, setScreen]);

            // Hàm xử lý khi nhấn nút Kiểm tra
            const handleManualCheck = () => {
                if (feedback || !gameReady || checkInFlightRef.current) return;
                setTimeLeft(0);
            };

            useEffect(() => {
                if (bgmRef.current) {
                    bgmRef.current.pause();
                    bgmRef.current = null;
                }
                if (settings.audio.bgm?.data && !isMuted) {
                    bgmRef.current = new Audio(mediaSrc(settings.audio.bgm.data));
                    bgmRef.current.loop = true;
                    bgmRef.current.volume = Math.min(1, Math.max(0, Number(settings.audio.bgmVolume ?? 0.3)));
                    bgmRef.current.play().catch(() => {});
                }
                return () => {
                    if (bgmRef.current) {
                        bgmRef.current.pause();
                        bgmRef.current = null;
                    }
                };
            }, [isMuted, settings.audio.bgm?.data, settings.audio.bgmVolume]);

            useEffect(() => {
                if (questionAudioRef.current) {
                    questionAudioRef.current.pause();
                    questionAudioRef.current = null;
                }
                const questionAudio = mediaSrc(currentQuestion?.audio?.data);
                if (questionAudio && !isMuted && !feedback) {
                    questionAudioRef.current = new Audio(questionAudio);
                    questionAudioRef.current.volume = Math.min(1, Math.max(0, Number(settings.audio.questionVolume ?? 1)));
                    questionAudioRef.current.play().catch(() => {});
                }
                return () => {
                    if (questionAudioRef.current) {
                        questionAudioRef.current.pause();
                        questionAudioRef.current = null;
                    }
                };
            }, [qIndex, currentQuestion?.audio?.data, isMuted, settings.audio.questionVolume]);

            useEffect(() => {
                if (!gameReady) return;
                const videoElement = videoRef.current;
                if (!videoElement) return;

                isMounted.current = true;
                const initPose = async () => {
                    try {
                        poseRef.current = new Pose({ 
                            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}` 
                        });
                        poseRef.current.setOptions({ modelComplexity: 1, smoothLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
                        poseRef.current.onResults((results) => {
                            if (!isMounted.current || !canvasRef.current) return;
                            const canvasCtx = canvasRef.current.getContext('2d');
                            canvasCtx.save();
                            canvasCtx.clearRect(0, 0, canvasRef.current.width, canvasRef.current.height);
                            if (results.poseLandmarks) {
                                drawConnectors(canvasCtx, results.poseLandmarks, POSE_CONNECTIONS, {color: '#6366f1', lineWidth: 3});
                                drawLandmarks(canvasCtx, results.poseLandmarks, { color: '#f43f5e', lineWidth: 1, radius: 3 });
                                setDetectedPose(analyzePose(results.poseLandmarks));
                            }
                            canvasCtx.restore();
                        });
                        if (!isMounted.current) return;
                        cameraRef.current = new Camera(videoElement, {
                            onFrame: async () => {
                                if (isMounted.current && poseRef.current && videoRef.current) {
                                    await poseRef.current.send({image: videoRef.current});
                                }
                            },
                            width: 640, height: 480
                        });
                        await cameraRef.current.start();
                        if (!isMounted.current && cameraRef.current) cameraRef.current.stop();
                    } catch (err) {
                        if (isMounted.current) console.warn('Camera/Pose init failed:', err);
                    }
                };
                initPose();
                return () => {
                    isMounted.current = false;
                    if (cameraRef.current) {
                        try { cameraRef.current.stop(); } catch (_) {}
                        cameraRef.current = null;
                    }
                    if (poseRef.current) {
                        try { poseRef.current.close(); } catch (_) {}
                        poseRef.current = null;
                    }
                };
            }, [gameReady]);

            useEffect(() => {
                if (!gameReady || gameError || feedback) return;
                if (timeLeft <= 0) { checkAnswer(); return; }
                const timer = setInterval(() => setTimeLeft(prev => prev - 1), 1000);
                const intervalTimer = setInterval(() => {
                    setCheckTimer(prev => {
                        if (prev <= 1) { checkAnswer(); return settings.checkInterval || 3; }
                        return prev - 1;
                    });
                }, 1000);
                return () => { clearInterval(timer); clearInterval(intervalTimer); };
            }, [timeLeft, feedback, checkTimer, checkAnswer, settings.checkInterval, gameReady, gameError]);

            if (!gameReady) {
                return (
                    <div className="w-full h-full bg-slate-950 text-white grid place-items-center p-6 text-center">
                        <div>
                            <div className="text-6xl mb-4">{gameError ? '⚠️' : '🎮'}</div>
                            <div className="text-2xl font-black">{gameError ? 'Không thể bắt đầu bài chơi' : 'Đang tạo phiên chơi trên backend...'}</div>
                            {gameError && <div className="mt-3 text-red-300 font-bold max-w-xl">{gameError}</div>}
                            <button onClick={() => setScreen('MENU')} className="mt-6 bg-indigo-600 hover:bg-indigo-500 px-6 py-3 rounded-xl font-black">← TRANG CHỦ</button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="w-full h-full flex flex-col bg-slate-100 overflow-hidden">
                    <div className="pose-game-header bg-indigo-700 px-6 py-1.5 text-white flex justify-between items-center shadow-lg z-20">
                        <div className="pose-game-header-left flex items-center gap-4">
                            <span className="pose-game-question-no text-xl font-black bg-white/20 px-5 py-1 rounded-xl">CÂU {qIndex + 1}</span>
                            <button onClick={() => setIsMuted(!isMuted)} className="pose-game-mute text-xl w-10 h-10 flex items-center justify-center bg-white/10 rounded-full hover:bg-white/20 transition-all">{isMuted ? '🔇' : '🔊'}</button>
                        </div>
                        <div className="pose-game-header-right flex items-center gap-6">
                            <div className="pose-game-timer flex flex-col items-center border-r border-white/20 pr-6">
                                <span className="pose-game-timer-label text-[10px] font-bold opacity-70 uppercase tracking-widest text-indigo-200">Quét sau</span>
                                <span className="pose-game-timer-value text-3xl font-black text-yellow-400 leading-none">{checkTimer}s</span>
                            </div>
                            <div className="flex flex-col items-center">
                                <span className="pose-game-timer-label text-[10px] font-bold opacity-70 uppercase tracking-widest text-indigo-200">Thời gian còn</span>
                                <span className={`pose-game-timer-value text-4xl font-black leading-none ${timeLeft < 5 ? 'text-red-400 animate-pulse' : 'text-white'}`}>{timeLeft}s</span>
                            </div>
                            <button onClick={handleManualCheck} className="pose-game-check bg-yellow-400 text-indigo-900 px-10 py-2 rounded-2xl font-black text-2xl shadow-xl hover:bg-yellow-300 transform active:scale-95 transition-all">KIỂM TRA</button>
                        </div>
                    </div>

                    <div className="pose-game-main flex-1 flex overflow-hidden">
                        <div
                            className="pose-game-content w-[62%] flex flex-col bg-white border-r-2 border-slate-200 p-2 gap-2 relative overflow-hidden"
                            style={lessonBackground ? {
                                backgroundImage: `url("${lessonBackground}")`,
                                backgroundSize: lessonBackgroundFit,
                                backgroundPosition: 'center',
                                backgroundRepeat: 'no-repeat'
                            } : undefined}
                        >
                            {lessonBackground && <div className="absolute inset-0 pointer-events-none" style={{backgroundColor: `rgba(248,250,252,${lessonOverlay})`}}></div>}
                            <div className="pose-question-panel flex-[5] bg-indigo-50/60 rounded-[2rem] border-2 border-indigo-100 flex flex-col items-center justify-center p-4 relative overflow-hidden z-10">
                                <h2 className="pose-question-text text-3xl font-black text-slate-800 mb-4 text-center leading-tight">{currentQuestion.text}</h2>
                                {currentQuestion.image ? (
                                    <div className="flex-1 w-full flex items-center justify-center overflow-hidden">
                                        <img src={mediaSrc(currentQuestion.image)} className="max-w-full max-h-full object-contain rounded-3xl shadow-2xl border-4 border-white" alt="Câu hỏi" />
                                    </div>
                                ) : (
                                    <div className="pose-question-visual w-64 h-64 flex items-center justify-center character-bounce">
                                         {getPoseVisual(currentQuestion.answers.find(a=>a.isCorrect)?.pose)}
                                    </div>
                                )}
                            </div>
                            
                            <div className="pose-answers-grid flex-[3] grid grid-cols-2 gap-2 relative z-10">
                                {currentQuestion.answers.slice(0, settings.numAnswers).map((ans, idx) => (
                                    <div key={idx} className={`pose-answer-card answer-card p-2.5 rounded-[1.5rem] border-4 flex items-center shadow-sm relative h-full transition-all ${detectedPose === ans.pose ? 'border-indigo-500 bg-indigo-50 ring-4 ring-indigo-200' : 'bg-white border-slate-100'}`}>
                                        <div className="pose-answer-letter flex-shrink-0 w-12 h-12 flex items-center justify-center bg-indigo-600 rounded-2xl mr-3 text-white text-2xl font-black shadow-md">{String.fromCharCode(65 + idx)}</div>
                                        <div className="flex-1 min-w-0 pr-2">
                                            <span className="pose-answer-text text-lg font-bold text-slate-700 leading-tight block line-clamp-2">{ans.text}</span>
                                        </div>
                                        <div className="pose-answer-visual flex-shrink-0 w-20 h-20 flex items-center justify-center bg-white rounded-2xl overflow-hidden border-2 border-slate-100 shadow-inner">
                                            {ans.image ? <img src={mediaSrc(ans.image)} className="w-full h-full object-contain" /> : getPoseVisual(ans.pose)}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>

                        <div className="pose-camera-panel w-[38%] relative bg-slate-900 overflow-hidden flex flex-col">
                            <div className="relative flex-1 bg-black">
                                <video ref={videoRef} playsInline className="camera-flip w-full h-full object-cover opacity-90" />
                                <canvas ref={canvasRef} className="camera-flip absolute inset-0 w-full h-full" />
                                <div className="pose-camera-status absolute bottom-4 left-4 right-4 bg-white/90 backdrop-blur-md p-3 rounded-2xl flex items-center justify-between shadow-2xl border border-white/50">
                                    <div className="flex items-center gap-3">
                                        <div className="pose-camera-status-icon w-12 h-12 flex items-center justify-center bg-white rounded-xl shadow-inner overflow-hidden border border-slate-200">
                                            {getPoseVisual(detectedPose)}
                                        </div>
                                        <div className="flex flex-col">
                                            <span className="text-[9px] font-black text-slate-400 uppercase tracking-tighter">Bạn đang:</span>
                                            <span className="pose-camera-status-name text-xl font-black text-indigo-700 uppercase italic leading-none">{DEFAULT_POSE_CONFIG[detectedPose].label}</span>
                                        </div>
                                    </div>
                                    <div className="pose-camera-scan flex items-center gap-2">
                                         <div className="text-right mr-2">
                                            <div className="text-[8px] font-bold text-slate-400 uppercase leading-none">Scanning</div>
                                            <div className="text-[10px] font-black text-indigo-500">{checkTimer}s</div>
                                         </div>
                                         <div className="w-10 h-10 rounded-full bg-indigo-600 flex items-center justify-center relative">
                                            <div className="absolute inset-0 rounded-full border-2 border-indigo-400 animate-ping opacity-20"></div>
                                            <div className="w-4 h-4 rounded-full bg-white"></div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            {feedback && (
                                <div className={`absolute inset-0 flex flex-col items-center justify-center z-50 text-white animate-in zoom-in duration-300 ${feedback === 'correct' ? 'correct-bg' : 'wrong-bg'}`}>
                                    <div className="text-[10rem] mb-4 drop-shadow-2xl">{feedback === 'correct' ? '🌟' : '💡'}</div>
                                    <div className="text-6xl font-black uppercase text-center p-4 drop-shadow-lg tracking-tighter">{feedback === 'correct' ? 'QUÁ GIỎI!' : 'CỐ GẮNG NHÉ!'}</div>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const FastImportModal = ({
            open, onClose, importText, setImportText, busy, preview,
            onAnalyzePaste, onExcel, importMode, setImportMode,
            poseMapping, onPoseChange, onApply
        }) => {
            if (!open) return null;
            const poseOptions = ['RAISE_LEFT', 'RAISE_RIGHT', 'BOTH_UP', 'CROSS_ARMS'];
            return (
                <div className="fixed inset-0 z-[100000] bg-slate-950/70 backdrop-blur-sm flex items-center justify-center p-4">
                    <div className="bg-white w-[min(1100px,96vw)] max-h-[94vh] rounded-[2rem] shadow-2xl overflow-hidden flex flex-col">
                        <div className="px-6 py-4 bg-gradient-to-r from-orange-500 to-amber-500 text-white flex items-center justify-between">
                            <div>
                                <h3 className="text-2xl font-black uppercase">⚡ Nhập nhanh câu hỏi</h3>
                                <p className="text-white/85 text-sm font-semibold">Dán từ Word / Excel / Google Sheets hoặc chọn file Excel .xlsx.</p>
                            </div>
                            <button onClick={onClose} className="w-10 h-10 rounded-full bg-white/20 hover:bg-white/30 font-black text-xl">✕</button>
                        </div>

                        <div className="flex-1 overflow-y-auto p-6 grid lg:grid-cols-[1fr_1.15fr] gap-6">
                            <div className="space-y-5">
                                <section className="bg-slate-50 border border-slate-200 rounded-2xl p-4">
                                    <div className="font-black text-slate-700 mb-2">1. Mapping đáp án → tư thế</div>
                                    <div className="grid grid-cols-2 gap-2">
                                        {['A','B','C','D'].map(letter => (
                                            <label key={letter} className="bg-white border border-slate-200 rounded-xl p-2 text-xs font-black text-slate-500">
                                                <span className="block mb-1 text-indigo-600">Đáp án {letter}</span>
                                                <select value={poseMapping[letter]} onChange={(e) => onPoseChange(letter, e.target.value)} className="w-full p-2 rounded-lg bg-slate-50 border border-slate-100 font-bold text-slate-700">
                                                    {poseOptions.map(poseId => <option key={poseId} value={poseId}>{DEFAULT_POSE_CONFIG[poseId].label}</option>)}
                                                </select>
                                            </label>
                                        ))}
                                    </div>
                                    <p className="text-[11px] text-slate-500 mt-2">Mỗi A–D nên dùng một tư thế khác nhau. Mapping áp dụng cho toàn bộ câu vừa nhập.</p>
                                </section>

                                <section className="bg-indigo-50/60 border border-indigo-100 rounded-2xl p-4">
                                    <div className="font-black text-indigo-800 mb-2">2A. Dán nhanh</div>
                                    <textarea
                                        value={importText}
                                        onChange={(e) => setImportText(e.target.value)}
                                        placeholder={"Câu 1. Thiết bị nào dùng để nhập văn bản?\nA. Chuột\nB. Bàn phím\nC. Loa\nD. Máy in\nĐáp án: B"}
                                        className="w-full min-h-[210px] p-3 bg-white rounded-xl border-2 border-indigo-100 outline-none focus:border-indigo-300 text-sm"
                                    />
                                    <button disabled={busy || !importText.trim()} onClick={onAnalyzePaste} className="mt-3 w-full bg-indigo-600 hover:bg-indigo-500 disabled:opacity-40 text-white py-3 rounded-xl font-black">
                                        {busy ? 'ĐANG PHÂN TÍCH...' : '🔎 PHÂN TÍCH NỘI DUNG DÁN'}
                                    </button>
                                </section>

                                <section className="bg-emerald-50/70 border border-emerald-100 rounded-2xl p-4">
                                    <div className="font-black text-emerald-800 mb-2">2B. Hoặc chọn Excel</div>
                                    <p className="text-xs text-emerald-700 mb-3">6 cột: <b>Câu hỏi | A | B | C | D | Đáp án</b>. Có thể thêm cột STT ở đầu.</p>
                                    <label className="block w-full bg-emerald-600 hover:bg-emerald-500 text-white py-3 rounded-xl font-black text-center cursor-pointer">
                                        📊 CHỌN EXCEL .XLSX
                                        <input type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" className="hidden" onChange={onExcel} />
                                    </label>
                                </section>
                            </div>

                            <div className="space-y-4">
                                <section className="bg-white border-2 border-slate-100 rounded-2xl p-4 min-h-[240px]">
                                    <div className="flex items-center justify-between gap-3 mb-3">
                                        <div className="font-black text-slate-700">3. Kiểm tra trước khi nhập</div>
                                        {preview && (
                                            <div className="flex gap-2 text-xs font-black">
                                                <span className="px-2 py-1 rounded-lg bg-slate-100 text-slate-600">{preview.total || 0} câu</span>
                                                <span className="px-2 py-1 rounded-lg bg-emerald-100 text-emerald-700">✓ {preview.valid_count || 0}</span>
                                                <span className="px-2 py-1 rounded-lg bg-red-100 text-red-700">⚠ {preview.invalid_count || 0}</span>
                                            </div>
                                        )}
                                    </div>

                                    {!preview && <div className="grid place-items-center h-[190px] text-slate-400 font-bold text-center">Dán nội dung hoặc chọn Excel rồi bấm phân tích.<br/>Dữ liệu chưa được thêm vào bài cho đến khi thầy/cô xác nhận.</div>}

                                    {preview && (
                                        <>
                                            {(preview.mapping_errors || []).map((msg, i) => <div key={'m'+i} className="mb-2 p-2 rounded-lg bg-red-50 text-red-700 text-xs font-bold">⚠ {msg}</div>)}
